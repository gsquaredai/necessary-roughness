<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Standings — Necessary Roughness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="standings">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Necessary <span>Roughness</span></a>
      <nav class="main-nav">
        <a href="index.html" data-page="home">Home</a>
        <a href="standings.html" data-page="standings">Standings</a>
        <a href="matchups.html" data-page="matchups">Matchups</a>
        <a href="drafts.html" data-page="drafts">Drafts</a>
        <a href="transactions.html" data-page="transactions">Transactions</a>
        <a href="info.html" data-page="info">Info</a>
        <a href="history.html" data-page="history">History</a>
      </nav>
    </div>
  </header>

  <div class="page">
    <main>
      <div class="controls">
        <select id="season-select"></select>
      </div>

      <div class="view-toggle" id="view-toggle">
        <button type="button" data-view="standings">Standings</button>
        <button type="button" data-view="draft">Draft Order</button>
        <button type="button" data-view="pf">PF</button>
        <button type="button" data-view="pa">PA</button>
        <button type="button" data-view="maxpf">Max PF</button>
      </div>

      <section>
        <div class="card table-wrap">
          <table>
            <thead>
              <tr>
                <th id="rank-header">#</th>
                <th>Team</th>
                <th class="num">Record</th>
                <th class="num">PF</th>
                <th class="num">Max PF</th>
                <th class="num">PA</th>
              </tr>
            </thead>
            <tbody id="standings-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/js/data.js"></script>
  <script>
    const VIEWS = {
      standings: {
        label: "#",
        sort: (teams) => standingsSorted({ teams }),
      },
      draft: {
        label: "Pick",
        sort: (teams) =>
          [...teams].sort((a, b) => (a.draftPick ?? 999) - (b.draftPick ?? 999)),
      },
      pf: {
        label: "#",
        sort: (teams) => [...teams].sort((a, b) => b.fpts - a.fpts),
      },
      pa: {
        label: "#",
        sort: (teams) => [...teams].sort((a, b) => b.fptsAgainst - a.fptsAgainst),
      },
      maxpf: {
        label: "#",
        sort: (teams) => [...teams].sort((a, b) => b.maxPF - a.maxPF),
      },
    };

    let currentSeason = null;
    let currentView = "standings";

    async function init() {
      const idx = await loadIndex();
      const select = document.getElementById("season-select");
      select.innerHTML = idx.seasons
        .slice()
        .reverse()
        .map((s) => `<option value="${s}">${s} Season</option>`)
        .join("");

      const params = new URLSearchParams(location.search);
      const requestedSeason = params.get("season");
      select.value = idx.seasons.includes(requestedSeason) ? requestedSeason : idx.currentSeason;

      const requestedView = params.get("view");
      currentView = VIEWS[requestedView] ? requestedView : "standings";
      updateViewButtons();

      select.addEventListener("change", () => {
        updateUrl();
        renderStandings(select.value);
      });

      document.getElementById("view-toggle").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-view]");
        if (!btn) return;
        currentView = btn.dataset.view;
        updateViewButtons();
        updateUrl();
        renderStandings(select.value);
      });

      function updateUrl() {
        const url = new URL(location.href);
        url.searchParams.set("season", select.value);
        url.searchParams.set("view", currentView);
        history.replaceState(null, "", url);
      }

      await renderStandings(select.value);
    }

    function updateViewButtons() {
      document.querySelectorAll("#view-toggle button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.view === currentView);
      });
      document.getElementById("rank-header").textContent = VIEWS[currentView].label;
    }

    async function renderStandings(seasonKey) {
      const season = await loadSeason(seasonKey);
      currentSeason = season;
      const sorted = VIEWS[currentView].sort(season.teams);

      document.getElementById("standings-body").innerHTML = sorted
        .map((team, i) => {
          const champ = season.champion === team.rosterId;
          const last = season.lastPlace === team.rosterId;
          const rankCell = currentView === "draft" ? team.draftPick ?? "—" : i + 1;
          return `
            <tr>
              <td>${rankCell}</td>
              <td>${teamCellHTML(team, { champ, last })}</td>
              <td class="num">${record(team)}</td>
              <td class="num">${fmtPts(team.fpts)}</td>
              <td class="num">${fmtPts(team.maxPF)}</td>
              <td class="num">${fmtPts(team.fptsAgainst)}</td>
            </tr>
          `;
        })
        .join("");
    }

    init().catch((err) => {
      console.error(err);
      document.getElementById("standings-body").innerHTML =
        '<tr><td colspan="6" class="empty-state">Could not load league data.</td></tr>';
    });
  </script>
</body>
</html>
