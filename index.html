<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Necessary Roughness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body data-page="home">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Necessary <span>Roughness</span></a>
      <nav class="main-nav">
        <a href="index.html" data-page="home">Home</a>
        <a href="standings.html" data-page="standings">Standings</a>
        <a href="matchups.html" data-page="matchups">Matchups</a>
        <a href="drafts.html" data-page="drafts">Drafts</a>
        <a href="transactions.html" data-page="transactions">Transactions</a>
        <a href="pickem.html" data-page="pickem">Pick-Em</a>
        <a href="info.html" data-page="info">Info</a>
        <a href="history.html" data-page="history">History</a>
      </nav>
    </div>
  </header>

  <div class="page">
    <main>
      <div class="hero">
        <h1 id="league-name">Necessary <span>Roughness</span></h1>
        <div id="champion-card-slot"></div>
      </div>

      <section id="standings-section">
        <h2>Current Standings</h2>
        <div class="card table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Team</th>
                <th class="num">Record</th>
                <th class="num">PF</th>
                <th class="num">Max PF</th>
                <th class="num">Pick-Em Pts</th>
              </tr>
            </thead>
            <tbody id="standings-body"></tbody>
          </table>
        </div>
        <div class="standing-cards" id="standings-cards"></div>
      </section>

      <p class="updated-note" id="updated-note"></p>
    </main>
  </div>

  <script src="assets/js/data.js"></script>
  <script>
    // Read-only Pick-Em pool points — same Firebase project as pickem.html,
    // signed in anonymously (no visible auth). computePickEmPoints()
    // (data.js) fails closed if this isn't ready, so the column/stat just
    // quietly shows 0 rather than erroring.
    const firebaseConfig = {
      apiKey: "AIzaSyAwRdeJXzmPaInTH2rDMNriQfErQPj33yQ",
      authDomain: "necessaryroughness-5edd5.firebaseapp.com",
      projectId: "necessaryroughness-5edd5",
      storageBucket: "necessaryroughness-5edd5.firebasestorage.app",
      messagingSenderId: "104157286944",
      appId: "1:104157286944:web:1a3506b9062c4149ee2245",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    auth.onAuthStateChanged((user) => {
      if (!user) auth.signInAnonymously().catch(() => {});
    });

    async function renderChampionCard() {
      const champSeason = await loadLatestCompletedSeason();
      const slot = document.getElementById("champion-card-slot");
      if (!champSeason) {
        slot.innerHTML = "";
        return;
      }
      const champ = teamById(champSeason, champSeason.champion);
      if (!champ) {
        slot.innerHTML = "";
        return;
      }
      slot.innerHTML = `
        <div class="champion-card">
          <div class="eyebrow">${champSeason.season} Champion</div>
          <div class="crown">${CROWN_SVG}</div>
          ${avatarImgHTML(champ)}
          <div class="champ-name">${champ.teamName}</div>
          <div class="champ-season">${champSeason.season} Season</div>
          <div class="champ-stats">
            <div class="stat">
              <div class="value">${record(champ)}</div>
              <div class="label">Record</div>
            </div>
            <div class="stat">
              <div class="value">${fmtPts(champ.fpts)}</div>
              <div class="label">Points</div>
            </div>
          </div>
        </div>
      `;

      const cardEl = slot.querySelector(".champion-card");
      if (cardEl) playChampionCelebration(cardEl);
    }

    async function renderHome() {
      const idx = await loadIndex();
      const season = await loadSeason(idx.currentSeason);
      const players = await loadPlayers();
      const pickemPoints = await computePickEmPoints(season, players);

      const standingsBody = document.getElementById("standings-body");
      const standingsCards = document.getElementById("standings-cards");
      const sorted = standingsSorted(season);
      const rows = sorted.map((team, i) => {
        const champ = season.champion === team.rosterId;
        const last = season.lastPlace === team.rosterId;
        const mine = isMyTeam(team.ownerId) ? " is-my-team" : "";
        const pickemPts = pickemPoints.get(team.ownerId) || 0;
        return { team, i, champ, last, mine, pickemPts };
      });

      standingsBody.innerHTML = rows
        .map(
          ({ team, i, champ, last, mine, pickemPts }) => `
            <tr class="${mine}">
              <td>${i + 1}</td>
              <td>${teamCellHTML(team, { champ, last })}</td>
              <td class="num">${record(team)}</td>
              <td class="num">${fmtPts(team.fpts)}</td>
              <td class="num">${fmtPts(team.maxPF)}</td>
              <td class="num">${pickemPts}</td>
            </tr>
          `
        )
        .join("");

      standingsCards.innerHTML = rows
        .map(
          ({ team, i, champ, last, mine, pickemPts }) => `
            <div class="standing-card${mine}">
              <div class="standing-card-top">
                <span class="standing-card-rank">${i + 1}</span>
                ${teamCellHTML(team, { champ, last })}
              </div>
              <div class="standing-card-stats">
                <div class="standing-card-stat">
                  <span class="standing-card-stat-label">Record</span>
                  <span class="standing-card-stat-value">${record(team)}</span>
                </div>
                <div class="standing-card-stat">
                  <span class="standing-card-stat-label">PF</span>
                  <span class="standing-card-stat-value">${fmtPts(team.fpts)}</span>
                </div>
                <div class="standing-card-stat">
                  <span class="standing-card-stat-label">Max PF</span>
                  <span class="standing-card-stat-value">${fmtPts(team.maxPF)}</span>
                </div>
                <div class="standing-card-stat">
                  <span class="standing-card-stat-label">Pick-Em Pts</span>
                  <span class="standing-card-stat-value">${pickemPts}</span>
                </div>
              </div>
            </div>
          `
        )
        .join("");

      document.getElementById("updated-note").textContent = `Data last updated ${new Date(
        idx.updatedAt
      ).toLocaleString()}`;
    }

    renderChampionCard().catch((err) => console.error(err));

    renderHome().catch((err) => {
      console.error(err);
      document.getElementById("standings-body").innerHTML =
        '<tr><td colspan="6" class="empty-state">Could not load league data.</td></tr>';
    });
  </script>
</body>
</html>
