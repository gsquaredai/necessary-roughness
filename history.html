<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>History — Necessary Roughness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="history">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Necessary <span>Roughness</span></a>
      <nav class="main-nav">
        <a href="index.html" data-page="home">Home</a>
        <a href="standings.html" data-page="standings">Standings</a>
        <a href="matchups.html" data-page="matchups">Matchups</a>
        <a href="drafts.html" data-page="drafts">Drafts</a>
        <a href="transactions.html" data-page="transactions">Transactions</a>
        <a href="info.html" data-page="info">Info</a>
        <a href="history.html" data-page="history">History</a>
      </nav>
    </div>
  </header>

  <div class="page">
    <main>
      <div class="view-toggle" id="history-tabs">
        <button type="button" data-tab="champions">Champions</button>
        <button type="button" data-tab="alltime">All-Time Standings</button>
        <button type="button" data-tab="scoring">Highest Scoring</button>
        <button type="button" data-tab="activity">Team Activity</button>
        <button type="button" data-tab="rivalries">Rivalries</button>
        <button type="button" data-tab="matchups">All Time Matchups</button>
      </div>

      <section>
        <div id="history-content"></div>
      </section>
    </main>
  </div>

  <script src="assets/js/data.js"></script>
  <script>
    async function loadTeamRecords() {
      try {
        const res = await fetch("data/team-records.json");
        return await res.json();
      } catch {
        return [];
      }
    }

    let allSeasons = null;
    let allPlayers = null;
    let seasonIndex = null;

    async function ensureData() {
      if (allSeasons) return;
      const idx = await loadIndex();
      const [seasons, players] = await Promise.all([loadAllSeasons(), loadPlayers()]);
      seasonIndex = idx;
      allSeasons = seasons;
      allPlayers = players;
    }

    function latestTeamByOwner(seasons, ownerId) {
      for (let i = seasons.length - 1; i >= 0; i--) {
        const t = seasons[i].teams.find((t) => t.ownerId === ownerId);
        if (t) return t;
      }
      return null;
    }

    // ---------- champions ----------

    async function renderChampionsTab(container) {
      await ensureData();
      const bySeasonKey = Object.fromEntries(seasonIndex.seasons.map((s, i) => [s, allSeasons[i]]));
      const cards = seasonIndex.seasons
        .slice()
        .reverse()
        .map((key) => {
          const season = bySeasonKey[key];
          const champ = season.teams.find((t) => t.rosterId === season.champion);
          const isCurrent = season.status !== "complete";

          if (!champ) {
            return `
              <a class="champion-card-link" href="standings.html?season=${key}">
                <div class="champion-card champion-card-blank">
                  <div class="eyebrow">${key} Champion</div>
                  <div class="champ-season">${isCurrent ? "Season in progress" : "No champion recorded"}</div>
                </div>
              </a>
            `;
          }

          return `
            <a class="champion-card-link" href="standings.html?season=${key}">
              <div class="champion-card">
                <div class="eyebrow">${key} Champion</div>
                <div class="crown">${CROWN_SVG}</div>
                ${avatarImgHTML(champ)}
                <div class="champ-name">${champ.teamName}</div>
                <div class="champ-season">${key} Season</div>
                <div class="champ-stats">
                  <div class="stat">
                    <div class="value">${record(champ)}</div>
                    <div class="label">Record</div>
                  </div>
                  <div class="stat">
                    <div class="value">${fmtPts(champ.fpts)}</div>
                    <div class="label">Points</div>
                  </div>
                </div>
              </div>
            </a>
          `;
        })
        .join("");

      container.innerHTML = `<div class="champion-card-grid">${cards}</div>`;

      container.querySelectorAll(".champion-card:not(.champion-card-blank)").forEach((cardEl) => {
        playChampionCelebration(cardEl);
      });
    }

    // ---------- all-time standings ----------

    async function renderAllTimeTab(container) {
      await ensureData();
      const byOwner = new Map();

      for (const season of allSeasons) {
        for (const team of season.teams) {
          const key = team.ownerId || team.teamName;
          if (!byOwner.has(key)) {
            byOwner.set(key, {
              displayName: team.displayName,
              teamName: team.teamName,
              avatar: team.avatar,
              wins: 0,
              losses: 0,
              ties: 0,
              fpts: 0,
              maxPF: 0,
              titles: 0,
            });
          }
          const agg = byOwner.get(key);
          agg.wins += team.wins;
          agg.losses += team.losses;
          agg.ties += team.ties;
          agg.fpts += team.fpts;
          agg.maxPF += team.maxPF ?? 0;
          agg.teamName = team.teamName;
          agg.avatar = team.avatar;
          if (season.champion === team.rosterId) agg.titles += 1;
        }
      }

      const rows = [...byOwner.values()].sort((a, b) => {
        const aTotal = a.wins + a.losses + a.ties;
        const bTotal = b.wins + b.losses + b.ties;
        const aPct = aTotal ? a.wins / aTotal : 0;
        const bPct = bTotal ? b.wins / bTotal : 0;
        if (b.titles !== a.titles) return b.titles - a.titles;
        return bPct - aPct;
      });

      const body = rows
        .map((r, i) => {
          const total = r.wins + r.losses + r.ties;
          const pct = total ? ((r.wins / total) * 100).toFixed(1) : "0.0";
          const recordStr = r.ties ? `${r.wins}-${r.losses}-${r.ties}` : `${r.wins}-${r.losses}`;
          return `
            <tr>
              <td>${i + 1}</td>
              <td>${teamCellHTML(r)}</td>
              <td class="num">${r.titles}</td>
              <td class="num">${recordStr}</td>
              <td class="num">${pct}%</td>
              <td class="num">${fmtPts(r.fpts)}</td>
              <td class="num">${fmtPts(r.maxPF)}</td>
            </tr>
          `;
        })
        .join("");

      container.innerHTML = `
        <div class="card table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Manager</th>
                <th class="num">Titles</th>
                <th class="num">Record</th>
                <th class="num">Win %</th>
                <th class="num">PF</th>
                <th class="num">Max PF</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    // ---------- highest scoring ----------

    function computeTopTeamScores(seasons) {
      const results = [];
      for (const season of seasons) {
        for (const weekKey of Object.keys(season.matchups)) {
          for (const m of season.matchups[weekKey]) {
            const week = Number(weekKey);
            if (m.teamA.points > 0) {
              results.push({
                team: teamById(season, m.teamA.rosterId),
                opponent: m.teamB ? teamById(season, m.teamB.rosterId) : null,
                points: m.teamA.points,
                season: season.season,
                week,
              });
            }
            if (m.teamB && m.teamB.points > 0) {
              results.push({
                team: teamById(season, m.teamB.rosterId),
                opponent: teamById(season, m.teamA.rosterId),
                points: m.teamB.points,
                season: season.season,
                week,
              });
            }
          }
        }
      }
      results.sort((a, b) => b.points - a.points);
      return results.slice(0, 10);
    }

    function computeTopPlayerScores(players) {
      const results = [];
      for (const p of Object.values(players)) {
        for (const [season, data] of Object.entries(p.seasons || {})) {
          for (const g of data.games || []) {
            if (g.played && g.points > 0) {
              results.push({
                playerId: p.playerId,
                name: p.name,
                position: p.position,
                nflTeam: p.nflTeam,
                points: g.points,
                season,
                week: g.week,
              });
            }
          }
        }
      }
      results.sort((a, b) => b.points - a.points);
      return results.slice(0, 10);
    }

    async function renderScoringTab(container) {
      await ensureData();
      const topTeams = computeTopTeamScores(allSeasons);
      const topPlayers = computeTopPlayerScores(allPlayers);

      const teamRows = topTeams.length
        ? topTeams
            .map(
              (r, i) => `
                <div class="info-stat-row">
                  <span class="info-stat-label" style="width: 22px; display: inline-block;">${i + 1}</span>
                  ${teamCellHTML(r.team)}
                  <span class="muted" style="flex: 1;">
                    vs ${r.opponent ? r.opponent.teamName : "Bye"} &middot; ${r.season} Wk ${r.week}
                  </span>
                  <span class="info-stat-value money accent">${fmtPts(r.points)}</span>
                </div>
              `
            )
            .join("")
        : '<div class="empty-state">No games played yet.</div>';

      const playerRows = topPlayers.length
        ? topPlayers
            .map(
              (r, i) => `
                <div class="info-stat-row">
                  <span class="info-stat-label" style="width: 22px; display: inline-block;">${i + 1}</span>
                  <span>${playerLinkHTML(r.playerId, r.name)}</span>
                  <span class="player-meta">${r.position || ""}${r.nflTeam ? " &middot; " + nflAbbr3(r.nflTeam) : ""}</span>
                  <span class="muted" style="flex: 1;">${r.season} Wk ${r.week}</span>
                  <span class="info-stat-value money accent">${fmtPts(r.points)}</span>
                </div>
              `
            )
            .join("")
        : '<div class="empty-state">No games played yet.</div>';

      container.innerHTML = `
        <div class="info-section-title">Highest Single-Week Team Score</div>
        <div class="draft-list">${teamRows}</div>
        <div class="info-section-title">Highest Single-Week Player Score</div>
        <div class="draft-list">${playerRows}</div>
      `;
    }

    // ---------- team activity & faab ----------

    async function renderActivityTab(container) {
      const records = await loadTeamRecords();
      const sorted = [...records].sort((a, b) => b.trades - a.trades);
      const body = sorted
        .map(
          (r) => `
            <tr>
              <td>${teamCellHTML(r)}</td>
              <td class="num">${r.trades}</td>
              <td class="num">${r.waiverPickups}</td>
              <td class="num">$${r.faabSpent} <span class="muted">($${r.faabSpentCurrent ?? 0})</span></td>
              <td class="num">${r.faabTradedNet > 0 ? "+" : ""}$${r.faabTradedNet}</td>
              <td class="num">$${r.faabUnspent} <span class="muted">($${r.faabCurrent ?? 0})</span></td>
            </tr>
          `
        )
        .join("");

      container.innerHTML = `
        <p class="muted" style="margin-bottom: 12px;">
          Trades, waiver pickups, and FAAB totals are lifetime; the number in parentheses is this season only.
        </p>
        <div class="card table-wrap">
          <table>
            <thead>
              <tr>
                <th>Manager</th>
                <th class="num">Trades</th>
                <th class="num">Waiver Pickups</th>
                <th class="num">FAAB Spent</th>
                <th class="num">Net FAAB Traded</th>
                <th class="num">FAAB Unspent</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    // ---------- rivalries (regular-season Rivalry Week only, no playoffs) ----------

    async function renderRivalriesTab(container) {
      await ensureData();
      const rivalries = await loadRivalries();
      const records = rivalries.map((r) => ({ ...r, winsA: 0, winsB: 0, ties: 0, meetings: 0, pointsA: 0, pointsB: 0 }));
      const findRecord = (ownerA, ownerB) => findRivalry(records, ownerA, ownerB);

      // Rivalry Week started in 2025, and only counts the two designated
      // rivalry weeks each season (Week 1 and the last regular-season
      // week) — not any other regular-season meeting, and not playoffs.
      for (const season of allSeasons) {
        if (season.season === "2024") continue;
        const lastRegularWeek = (season.leagueSettings?.playoffWeekStart ?? 15) - 1;
        for (const week of [1, lastRegularWeek]) {
          const matchups = season.matchups[week] || season.matchups[String(week)] || [];
          for (const m of matchups) {
            if (!m.teamB) continue;
            if (!(m.teamA.points > 0 || m.teamB.points > 0)) continue; // not played
            const teamA = teamById(season, m.teamA.rosterId);
            const teamB = teamById(season, m.teamB.rosterId);
            if (!teamA?.ownerId || !teamB?.ownerId) continue;
            const rec = findRecord(teamA.ownerId, teamB.ownerId);
            if (!rec) continue;
            const aIsOwnersFirst = rec.owners[0] === teamA.ownerId;
            if (m.teamA.points > m.teamB.points) rec[aIsOwnersFirst ? "winsA" : "winsB"] += 1;
            else if (m.teamB.points > m.teamA.points) rec[aIsOwnersFirst ? "winsB" : "winsA"] += 1;
            else rec.ties += 1;
            rec[aIsOwnersFirst ? "pointsA" : "pointsB"] += m.teamA.points;
            rec[aIsOwnersFirst ? "pointsB" : "pointsA"] += m.teamB.points;
            rec.meetings += 1;
          }
        }
      }

      const rows = records
        .map((r) => {
          const teamA = latestTeamByOwner(allSeasons, r.owners[0]);
          const teamB = latestTeamByOwner(allSeasons, r.owners[1]);
          const recordStr = r.ties ? `${r.winsA}-${r.winsB}-${r.ties}` : `${r.winsA}-${r.winsB}`;
          return `
            <div class="info-stat-row" style="flex-direction: column; gap: 8px; padding: 14px;">
              <div class="rivalry-banner" style="--rivalry-color: ${r.color || "#4cc9f0"}; margin: 0;">${r.name}</div>
              <div style="display: flex; justify-content: center; align-items: center; gap: 16px;">
                <div style="text-align: center;">
                  ${teamA ? teamCellHTML(teamA) : '<span class="muted">Unknown</span>'}
                  ${r.meetings ? `<div class="muted" style="margin-top: 4px;">${fmtPts(r.pointsA)} pts</div>` : ""}
                </div>
                <span class="info-stat-value money accent">${
                  r.meetings ? recordStr : "No meetings yet"
                }</span>
                <div style="text-align: center;">
                  ${teamB ? teamCellHTML(teamB) : '<span class="muted">Unknown</span>'}
                  ${r.meetings ? `<div class="muted" style="margin-top: 4px;">${fmtPts(r.pointsB)} pts</div>` : ""}
                </div>
              </div>
            </div>
          `;
        })
        .join("");

      container.innerHTML = `
        <p class="muted" style="margin-bottom: 12px;">
          Regular-season Rivalry Week only (Week 1 and Week 14), no playoffs. Rivalry Week started in 2025, so
          2024 isn't counted.
        </p>
        <div class="draft-list">${rows}</div>
      `;
    }

    // ---------- all time matchups (full head-to-head grid, incl. playoffs) ----------

    // Same bracket pruning as the Matchups page's playoff view: drop any
    // match at a hidden placement, then drop the semifinal-round matches
    // that only fed into those now-hidden placement games. Reused here (not
    // just for display) so the H2H grid only counts the "meaningful"
    // playoff games — the ones whose result actually determined something —
    // not every consolation game the bracket software generates.
    function pruneBracket(matches, hiddenPlaces) {
      let visible = matches.filter((m) => !hiddenPlaces.has(m.p));
      const rounds = [...new Set(visible.map((m) => m.r))].sort((a, b) => a - b);
      if (rounds.length >= 2) {
        const finalRound = rounds[rounds.length - 1];
        const referenced = new Set();
        for (const m of visible) {
          if (m.r !== finalRound) continue;
          if (m.t1_from) referenced.add(m.t1_from.w ?? m.t1_from.l);
          if (m.t2_from) referenced.add(m.t2_from.w ?? m.t2_from.l);
        }
        const semiRound = rounds[rounds.length - 2];
        visible = visible.filter((m) => m.r !== semiRound || referenced.has(m.m));
      }
      return visible;
    }

    // Winners bracket: round 1 (4 games) + the 2 true semifinals + the
    // championship and 3rd-place game (8 games) — never 5th/7th place.
    // Loser's bracket (bonus 3.13 pick, 2026+ only): all 4 games (the 2
    // first-round games, the championship, and the 3rd-place game).
    function meaningfulPlayoffMatchups(season) {
      const playoffWeekStart = season.leagueSettings?.playoffWeekStart ?? null;
      if (playoffWeekStart == null) return [];
      const winners = season.playoffBracket?.winners || [];
      const losers = season.playoffBracket?.losers || [];
      if (!winners.some((m) => m.w != null)) return [];

      const results = [];
      const collect = (matches, hiddenPlaces) => {
        for (const m of pruneBracket(matches, hiddenPlaces)) {
          if (m.t1 == null || m.t2 == null) continue;
          results.push({ week: playoffWeekStart + m.r - 1, rosterA: m.t1, rosterB: m.t2 });
        }
      };
      collect(winners, new Set([5, 7]));
      if (parseInt(season.season, 10) >= 2026) collect(losers, new Set());
      return results;
    }

    function computeH2HGrid(seasons) {
      const grid = new Map(); // ownerId -> Map(opponentOwnerId -> {wins, losses, ties})
      const ensure = (a, b) => {
        if (!grid.has(a)) grid.set(a, new Map());
        if (!grid.get(a).has(b)) grid.get(a).set(b, { wins: 0, losses: 0, ties: 0 });
        return grid.get(a).get(b);
      };
      const ownerOrder = [];
      const seen = new Set();
      const recordResult = (teamA, teamB, ptsA, ptsB) => {
        if (!teamA?.ownerId || !teamB?.ownerId) return;
        const recA = ensure(teamA.ownerId, teamB.ownerId);
        const recB = ensure(teamB.ownerId, teamA.ownerId);
        if (ptsA > ptsB) {
          recA.wins += 1;
          recB.losses += 1;
        } else if (ptsB > ptsA) {
          recB.wins += 1;
          recA.losses += 1;
        } else {
          recA.ties += 1;
          recB.ties += 1;
        }
      };

      for (const season of seasons) {
        for (const team of season.teams) {
          if (team.ownerId && !seen.has(team.ownerId)) {
            seen.add(team.ownerId);
            ownerOrder.push(team.ownerId);
          }
        }
        const lastRegularWeek = (season.leagueSettings?.playoffWeekStart ?? 15) - 1;

        // Regular season: every played week counts.
        for (let week = 1; week <= lastRegularWeek; week++) {
          const matchups = season.matchups[week] || season.matchups[String(week)] || [];
          for (const m of matchups) {
            if (!m.teamB) continue;
            if (!(m.teamA.points > 0 || m.teamB.points > 0)) continue; // not played
            recordResult(
              teamById(season, m.teamA.rosterId),
              teamById(season, m.teamB.rosterId),
              m.teamA.points,
              m.teamB.points
            );
          }
        }

        // Playoffs: only the meaningful bracket games.
        for (const { week, rosterA, rosterB } of meaningfulPlayoffMatchups(season)) {
          const matchups = season.matchups[week] || season.matchups[String(week)] || [];
          const entry = matchups.find(
            (m) =>
              m.teamB &&
              ((m.teamA.rosterId === rosterA && m.teamB.rosterId === rosterB) ||
                (m.teamA.rosterId === rosterB && m.teamB.rosterId === rosterA))
          );
          if (!entry) continue;
          const ptsA = entry.teamA.rosterId === rosterA ? entry.teamA.points : entry.teamB.points;
          const ptsB = entry.teamA.rosterId === rosterB ? entry.teamA.points : entry.teamB.points;
          recordResult(teamById(season, rosterA), teamById(season, rosterB), ptsA, ptsB);
        }
      }
      return { grid, ownerOrder };
    }

    // Lifetime record against the league median — regular season only,
    // per the League Median rule (playoffs don't use a median).
    function computeMedianRecords(seasons) {
      const records = new Map();
      for (const season of seasons) {
        const lastRegularWeek = (season.leagueSettings?.playoffWeekStart ?? 15) - 1;
        for (let week = 1; week <= lastRegularWeek; week++) {
          if (!weekHasBeenPlayed(season, week)) continue;
          const median = weekMedian(season, week);
          if (median == null) continue;
          for (const m of season.matchups[week] || []) {
            for (const side of [m.teamA, m.teamB].filter(Boolean)) {
              const team = teamById(season, side.rosterId);
              if (!team?.ownerId) continue;
              if (!records.has(team.ownerId)) records.set(team.ownerId, { wins: 0, losses: 0, ties: 0 });
              const r = records.get(team.ownerId);
              if (side.points > median) r.wins += 1;
              else if (side.points < median) r.losses += 1;
              else r.ties += 1;
            }
          }
        }
      }
      return records;
    }

    async function renderMatchupsTab(container) {
      await ensureData();
      const { grid, ownerOrder } = computeH2HGrid(allSeasons);
      const medianRecords = computeMedianRecords(allSeasons);
      const owners = ownerOrder
        .map((id) => latestTeamByOwner(allSeasons, id))
        .filter(Boolean)
        .sort((a, b) => a.teamName.localeCompare(b.teamName));

      const headerCells = owners
        .map((t) => `<th>${avatarImgHTML(t)}<div class="h2h-col-name">${t.teamName}</div></th>`)
        .join("");

      const bodyRows = owners
        .map((rowTeam) => {
          const cells = owners
            .map((colTeam) => {
              if (rowTeam.ownerId === colTeam.ownerId) return `<td class="h2h-self">&mdash;</td>`;
              const rec = grid.get(rowTeam.ownerId)?.get(colTeam.ownerId);
              if (!rec || rec.wins + rec.losses + rec.ties === 0) return `<td class="muted">&mdash;</td>`;
              const str = rec.ties ? `${rec.wins}-${rec.losses}-${rec.ties}` : `${rec.wins}-${rec.losses}`;
              const cls = rec.wins > rec.losses ? "h2h-winning" : rec.losses > rec.wins ? "h2h-losing" : "";
              return `<td class="${cls}">${str}</td>`;
            })
            .join("");
          const mr = medianRecords.get(rowTeam.ownerId);
          const medianStr = mr
            ? mr.ties
              ? `${mr.wins}-${mr.losses}-${mr.ties}`
              : `${mr.wins}-${mr.losses}`
            : "&mdash;";
          const medianCls = mr && mr.wins > mr.losses ? "h2h-winning" : mr && mr.losses > mr.wins ? "h2h-losing" : "";
          return `
            <tr>
              <th class="h2h-row-label">${avatarImgHTML(rowTeam)}<span>${rowTeam.teamName}</span></th>
              ${cells}
              <td class="h2h-median ${medianCls}">${medianStr}</td>
            </tr>
          `;
        })
        .join("");

      container.innerHTML = `
        <p class="muted" style="margin-bottom: 12px;">
          Every regular-season and playoff meeting, all-time — read a row as that manager's record against the
          column. Playoffs only count the games that actually determined something (first round, semis, and the
          championship/3rd-place games; the loser's-bracket bonus-pick games count from 2026 on). "vs Median"
          is regular season only.
        </p>
        <div class="card table-wrap">
          <table class="h2h-grid">
            <thead>
              <tr><th></th>${headerCells}<th>vs Median</th></tr>
            </thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>
      `;
    }

    // ---------- tab wiring ----------

    const TAB_RENDERERS = {
      champions: renderChampionsTab,
      alltime: renderAllTimeTab,
      scoring: renderScoringTab,
      activity: renderActivityTab,
      rivalries: renderRivalriesTab,
      matchups: renderMatchupsTab,
    };

    async function showTab(tab) {
      const container = document.getElementById("history-content");
      container.innerHTML = `<div class="empty-state">Loading...</div>`;
      const fn = TAB_RENDERERS[tab] || renderChampionsTab;
      await fn(container);
    }

    async function init() {
      const tabs = document.getElementById("history-tabs");
      const params = new URLSearchParams(location.search);
      const requested = params.get("tab");
      const initialTab = TAB_RENDERERS[requested] ? requested : "champions";

      tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.tab === initialTab));

      tabs.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-tab]");
        if (!btn) return;
        tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
        const url = new URL(location.href);
        url.searchParams.set("tab", btn.dataset.tab);
        history.replaceState(null, "", url);
        showTab(btn.dataset.tab);
      });

      await showTab(initialTab);
    }

    init().catch((err) => {
      console.error(err);
      document.getElementById("history-content").innerHTML =
        '<div class="empty-state">Could not load league data.</div>';
    });
  </script>
</body>
</html>
