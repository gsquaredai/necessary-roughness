<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pick-Em — Necessary Roughness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body data-page="pickem">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Necessary <span>Roughness</span></a>
      <nav class="main-nav">
        <a href="index.html" data-page="home">Home</a>
        <a href="standings.html" data-page="standings">Standings</a>
        <a href="matchups.html" data-page="matchups">Matchups</a>
        <a href="drafts.html" data-page="drafts">Drafts</a>
        <a href="transactions.html" data-page="transactions">Transactions</a>
        <a href="pickem.html" data-page="pickem">Pick-Em</a>
        <a href="info.html" data-page="info">Info</a>
        <a href="history.html" data-page="history">History</a>
      </nav>
    </div>
  </header>

  <div class="page">
    <main>
      <div id="pickem-root"></div>
    </main>
  </div>

  <script src="assets/js/data.js"></script>
  <script>
    // A real database (Firebase free tier) — this is the one feature on an
    // otherwise fully static/read-only site that needs shared, multi-user,
    // writable state: 12 managers submitting and editing their own picks,
    // with everyone seeing the same pool standings. No visible sign-in —
    // every visitor is signed in anonymously behind the scenes purely so
    // Firestore's security rules have a stable request.auth.uid to check
    // (a signed-in browser can only write its own identity doc, and only
    // the picks doc for whatever team that identity doc claims). Which
    // team someone IS is just the site-wide "which team are you" pick
    // (assets/js/data.js), honor system from there on.
    const firebaseConfig = {
      apiKey: "AIzaSyAwRdeJXzmPaInTH2rDMNriQfErQPj33yQ",
      authDomain: "necessaryroughness-5edd5.firebaseapp.com",
      projectId: "necessaryroughness-5edd5",
      storageBucket: "necessaryroughness-5edd5.firebasestorage.app",
      messagingSenderId: "104157286944",
      appId: "1:104157286944:web:1a3506b9062c4149ee2245",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentSeason = null;
    let allPlayers = null;
    let rivalries = [];
    let currentUser = null;
    let identity = null; // {ownerId, rosterId, teamName}, from identities/{uid}
    let currentPicks = {};

    // ---------- week gating ----------

    function lastRegularWeek() {
      return (currentSeason.leagueSettings?.playoffWeekStart ?? 15) - 1;
    }

    // A new week's picks unlock once the previous week has actually been
    // played — never further ahead than that, and never past the regular
    // season (no Pick-Em on playoff weeks).
    function unlockedThroughWeek() {
      const played = latestWeekWithData(currentSeason);
      const next = played == null ? 1 : played + 1;
      return Math.min(next, lastRegularWeek());
    }

    // ---------- kickoff lock ----------
    // Once a week's first game kicks off (minus a safety buffer), no new
    // picks or edits are accepted for it — "you snooze, you lose." Sleeper's
    // own schedule data (data/schedule.json) only has a date, not a kickoff
    // time, so this checks ESPN's public scoreboard API live, in the
    // browser, for the real kickoff timestamp — not the static, build-time
    // schedule snapshot.
    const LOCK_BUFFER_MS = 30 * 60 * 1000;
    const kickoffCache = new Map(); // week -> earliest kickoff (ms), or null if unknown

    async function firstKickoffForWeek(week) {
      if (kickoffCache.has(week)) return kickoffCache.get(week);
      let kickoff = null;
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        const res = await fetch(
          `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${week}&dates=${currentSeason.season}`,
          { signal: controller.signal }
        );
        clearTimeout(timeout);
        const data = await res.json();
        const times = (data.events || [])
          .map((e) => new Date(e.date).getTime())
          .filter((t) => !Number.isNaN(t));
        if (times.length) kickoff = Math.min(...times);
      } catch {
        // network hiccup / API unreachable — treat as unknown, fail open
      }
      kickoffCache.set(week, kickoff);
      return kickoff;
    }

    async function isWeekLocked(week) {
      const kickoff = await firstKickoffForWeek(week);
      if (kickoff == null) return false; // can't determine kickoff — don't block
      return Date.now() >= kickoff - LOCK_BUFFER_MS;
    }

    // ---------- team identity ----------

    // Shows the "which team are you?" picker directly in Pick-Em. Picking
    // a team here sets it as the site-wide identity too (assets/js/data.js)
    // so the rest of the site picks it up as well.
    function renderTeamPickerUI() {
      const root = document.getElementById("pickem-root");
      const rows = currentSeason.teams
        .slice()
        .sort((a, b) => a.teamName.localeCompare(b.teamName))
        .map(
          (t) => `
            <div class="team-list-row" data-roster-id="${t.rosterId}" role="button" tabindex="0">
              ${avatarImgHTML(t)}
              <div class="team-list-info">
                <div class="team-name">${t.teamName}</div>
                <div class="team-list-owner">${t.displayName}</div>
              </div>
            </div>
          `
        )
        .join("");
      root.innerHTML = `
        <div class="info-lead" style="text-align: center; margin-bottom: 16px;">Which team are you?</div>
        <div class="team-box-list">${rows}</div>
      `;
      root.querySelectorAll(".team-list-row").forEach((row) => {
        const pick = () => claimTeam(teamById(currentSeason, Number(row.dataset.rosterId)));
        row.addEventListener("click", pick);
        row.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            pick();
          }
        });
      });
    }

    async function claimTeam(team) {
      await db.collection("identities").doc(currentUser.uid).set({
        ownerId: team.ownerId,
        rosterId: team.rosterId,
        teamName: team.teamName,
      });
      saveSiteIdentity(team);
      refreshSiteIdentityBar();
      identity = { ownerId: team.ownerId, rosterId: team.rosterId, teamName: team.teamName };
      renderMain();
    }

    // Reconciles Pick-Em's Firestore identity with the site-wide "which
    // team are you" pick (localStorage). If no team's been picked anywhere
    // on the site yet, forces the picker here before anything else shows.
    async function resolveIdentityAndRender() {
      const siteId = loadSiteIdentity();
      if (siteId) {
        const team = teamById(currentSeason, siteId.rosterId);
        if (team) {
          const idDoc = await db.collection("identities").doc(currentUser.uid).get();
          if (idDoc.exists && idDoc.data().ownerId === team.ownerId) {
            identity = idDoc.data();
            renderMain();
          } else {
            await claimTeam(team);
          }
          return;
        }
      }
      renderTeamPickerUI();
    }

    // ---------- main shell ----------

    function renderMain() {
      const root = document.getElementById("pickem-root");
      root.innerHTML = `
        <div class="view-toggle" id="pickem-tabs">
          <button type="button" data-tab="weeks">Weeks</button>
          <button type="button" data-tab="pool">Pool</button>
        </div>
        <div id="pickem-content"></div>
      `;

      const tabs = root.querySelector("#pickem-tabs");
      const params = new URLSearchParams(location.search);
      const initialTab = params.get("tab") === "pool" ? "pool" : "weeks";
      tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.tab === initialTab));

      tabs.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-tab]");
        if (!btn) return;
        tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
        const url = new URL(location.href);
        url.searchParams.set("tab", btn.dataset.tab);
        history.replaceState(null, "", url);
        showPickemTab(btn.dataset.tab);
      });

      showPickemTab(initialTab);
    }

    async function showPickemTab(tab) {
      const content = document.getElementById("pickem-content");
      content.innerHTML = `<div class="empty-state">Loading...</div>`;
      if (tab === "pool") await renderPoolTab(content);
      else await renderWeeksTab(content);
    }

    // ---------- weeks tab ----------

    async function renderWeeksTab(container) {
      const maxWeek = unlockedThroughWeek();
      const weeks = [];
      for (let w = 1; w <= maxWeek; w++) weeks.push(w);

      const params = new URLSearchParams(location.search);
      const requestedWeek = Number(params.get("week"));
      const initialWeek = weeks.includes(requestedWeek) ? requestedWeek : maxWeek;

      container.innerHTML = `
        <div class="controls">
          <select id="pickem-week-select">${weeks.map((w) => `<option value="${w}">Week ${w}</option>`).join("")}</select>
        </div>
        <div id="pickem-week-body"></div>
      `;

      const sel = container.querySelector("#pickem-week-select");
      sel.value = initialWeek;
      sel.addEventListener("change", () => {
        const url = new URL(location.href);
        url.searchParams.set("week", sel.value);
        history.replaceState(null, "", url);
        renderWeekBody(container.querySelector("#pickem-week-body"), Number(sel.value));
      });

      const url = new URL(location.href);
      url.searchParams.set("week", String(initialWeek));
      history.replaceState(null, "", url);

      await renderWeekBody(container.querySelector("#pickem-week-body"), initialWeek);
    }

    function picksDocId(ownerId, week) {
      return `${ownerId}_${week}`;
    }

    async function loadPicksDoc(ownerId, week) {
      const snap = await db.collection("picks").doc(picksDocId(ownerId, week)).get();
      return snap.exists ? snap.data() : null;
    }

    async function renderWeekBody(container, week) {
      container.innerHTML = `<div class="empty-state">Loading...</div>`;
      const [existing, counts, locked] = await Promise.all([
        identity ? loadPicksDoc(identity.ownerId, week) : null,
        loadPickCounts(week),
        isWeekLocked(week),
      ]);
      currentPicks = existing && existing.picks ? { ...existing.picks } : {};

      const matchups = (currentSeason.matchups[week] || []).filter((m) => m.teamB);
      if (!matchups.length) {
        container.innerHTML = `<div class="empty-state">No matchups for this week.</div>`;
        return;
      }
      // While a week's still open for picks, pull fresh Sleeper projections
      // on every load so the spread actually tracks real-world projection
      // moves — not just whatever the site's data was last built with.
      // Once it locks, fall back to the static/frozen snapshot below.
      const matchupInfo = locked
        ? matchups.map((m) => matchupSpreadInfo(currentSeason, allPlayers, m))
        : await Promise.all(matchups.map((m) => liveMatchupSpreadInfo(currentSeason, allPlayers, m, week)));
      if (locked) {
        // Freeze the spread everyone sees/is graded against at exactly what
        // it was the moment this week locked (30 min before kickoff) —
        // permanent in Firestore, so a later data refresh can't move it.
        await ensureLockedSpreadsSaved(currentSeason, week, matchupInfo);
        applyLockedSpreads(matchupInfo, await loadLockedSpreads(currentSeason, week));
      }
      const isRivalryWeek = week === 1 || week === lastRegularWeek();

      container.innerHTML = `
        ${
          isRivalryWeek
            ? `
              <div class="info-callout">
                <span class="info-callout-label">Rivalry Week</span>
                Correct spread picks count double this week — 2 points each instead of 1.
              </div>
            `
            : ""
        }
        ${
          locked
            ? `
              <div class="info-callout pickem-locked-callout">
                <span class="info-callout-label">Picks Locked</span>
                The first game of Week ${week} has kicked off (or kicks off within 30 minutes) — no new picks or
                edits are accepted for this week anymore.
              </div>
            `
            : ""
        }
        <div class="draft-list${locked ? " pickem-locked" : ""}" id="pickem-matchups">${matchupInfo.map((info) => pickemMatchupCardHTML(info, week, counts)).join("")}</div>
        <button type="button" id="pickem-submit" class="btn-primary" style="margin-top: 16px;"${locked ? " disabled" : ""}>${
          locked ? "Picks Locked" : existing ? "Update Picks" : "Submit Picks"
        }</button>
        <div id="pickem-submit-status" class="muted" style="margin-top: 8px;"></div>
      `;

      const list = container.querySelector("#pickem-matchups");

      if (!locked) {
        list.querySelectorAll("[data-pick-roster]").forEach((el) => {
          el.addEventListener("click", () => {
            const matchupId = el.dataset.matchupId;
            currentPicks[matchupId] = Number(el.dataset.pickRoster);
            list
              .querySelectorAll(`[data-matchup-id="${matchupId}"][data-pick-roster]`)
              .forEach((x) => x.classList.toggle("selected", x === el));
            updateSubmitButtonState(container, matchupInfo);
          });
        });
      }

      list.querySelectorAll("[data-view-rosters]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          openMatchupModal(currentSeason, week, Number(btn.dataset.t1), Number(btn.dataset.t2), { optimalLineup: true });
        });
      });

      if (locked) return;

      updateSubmitButtonState(container, matchupInfo);

      container.querySelector("#pickem-submit").addEventListener("click", () => submitPicks(container, week, matchupInfo));
    }

    function updateSubmitButtonState(container, matchupInfo) {
      const btn = container.querySelector("#pickem-submit");
      if (!btn) return;
      const allPicked = matchupInfo.every((info) => currentPicks[info.m.matchupId] != null);
      btn.disabled = !allPicked;
    }

    function pickemMatchupCardHTML(info, week, counts) {
      const { m, teamA, teamB, totalA, totalB, spread, favRosterId } = info;
      const favA = favRosterId === teamA.rosterId;
      const lineA = spread === 0 ? "PICK'EM" : favA ? `-${spread.toFixed(1)}` : `+${spread.toFixed(1)}`;
      const lineB = spread === 0 ? "PICK'EM" : favA ? `+${spread.toFixed(1)}` : `-${spread.toFixed(1)}`;
      const pickedA = currentPicks[m.matchupId] === teamA.rosterId;
      const pickedB = currentPicks[m.matchupId] === teamB.rosterId;
      const matchupCounts = counts ? counts[m.matchupId] : null;
      const countA = matchupCounts ? matchupCounts[teamA.rosterId] || 0 : null;
      const countB = matchupCounts ? matchupCounts[teamB.rosterId] || 0 : null;

      // Same rivalry theming as the Matchups page — Week 1 and the last
      // regular-season week only, and only for 2025+ (when Rivalry Week
      // started).
      const rivalry =
        parseInt(currentSeason.season, 10) >= 2025 ? findRivalry(rivalries, teamA.ownerId, teamB.ownerId) : null;
      const isRivalryWeek = week === 1 || week === lastRegularWeek();
      const showRivalry = !!(rivalry && isRivalryWeek);
      const rivalryStyle = showRivalry && rivalry.color ? ` style="--rivalry-color: ${rivalry.color};"` : "";

      return `
        <div class="pickem-card${showRivalry ? " rivalry-matchup" : ""}"${rivalryStyle}>
          ${showRivalry ? `<div class="rivalry-banner">${rivalry.name}</div>` : ""}
          <div class="pickem-card-row">
            <div class="pickem-side${pickedA ? " selected" : ""}" data-matchup-id="${m.matchupId}" data-pick-roster="${teamA.rosterId}">
              ${teamCellHTML(teamA)}
              <div class="pickem-proj">Proj ${fmtPts(totalA)}</div>
              <div class="pickem-line">${lineA}</div>
              ${countA != null ? `<div class="pick-count">${countA} picked</div>` : ""}
            </div>
            <div class="pickem-vs">vs</div>
            <div class="pickem-side${pickedB ? " selected" : ""}" data-matchup-id="${m.matchupId}" data-pick-roster="${teamB.rosterId}">
              ${teamCellHTML(teamB)}
              <div class="pickem-proj">Proj ${fmtPts(totalB)}</div>
              <div class="pickem-line">${lineB}</div>
              ${countB != null ? `<div class="pick-count">${countB} picked</div>` : ""}
            </div>
          </div>
          <button type="button" class="pickem-expand-btn" data-view-rosters data-t1="${teamA.rosterId}" data-t2="${teamB.rosterId}">View Rosters &amp; Projections</button>
        </div>
      `;
    }

    async function submitPicks(container, week, matchupInfo) {
      const status = container.querySelector("#pickem-submit-status");
      if (!matchupInfo.every((info) => currentPicks[info.m.matchupId] != null)) {
        status.textContent = `Pick all ${matchupInfo.length} matchups before submitting.`;
        return;
      }

      // Re-check the lock right before saving — the page may have been sitting
      // open since before kickoff.
      if (await isWeekLocked(week)) {
        await renderWeekBody(container, week);
        return;
      }

      status.textContent = "Saving...";
      try {
        await db
          .collection("picks")
          .doc(picksDocId(identity.ownerId, week))
          .set({
            uid: currentUser.uid,
            ownerId: identity.ownerId,
            week,
            picks: currentPicks,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
        status.textContent = "Picks saved!";
      } catch (err) {
        status.textContent = "Something went wrong saving — try again.";
      }
    }

    // ---------- pool tab ----------

    async function renderPoolTab(container) {
      const maxWeek = unlockedThroughWeek();
      const gradedThroughWeek = latestWeekWithData(currentSeason) ?? 0;

      const [pointsByOwner, submittedSnap] = await Promise.all([
        computePickEmPoints(currentSeason, allPlayers),
        db.collection("picks").where("week", "==", maxWeek).get(),
      ]);
      const submittedThisWeek = new Set(submittedSnap.docs.map((d) => d.data().ownerId));

      const teams = currentSeason.teams
        .slice()
        .sort((a, b) => (pointsByOwner.get(b.ownerId) || 0) - (pointsByOwner.get(a.ownerId) || 0));

      const body = teams
        .map(
          (t) => `
            <tr>
              <td>${teamCellHTML(t)}</td>
              <td class="num">${pointsByOwner.get(t.ownerId) || 0}</td>
              <td class="num">${submittedThisWeek.has(t.ownerId) ? "&#10003;" : "&mdash;"}</td>
            </tr>
          `
        )
        .join("");

      const cards = teams
        .map(
          (t) => `
            <div class="standing-card">
              <div class="standing-card-top">
                ${teamCellHTML(t)}
              </div>
              <div class="standing-card-stats">
                <div class="standing-card-stat">
                  <span class="standing-card-stat-label">Points</span>
                  <span class="standing-card-stat-value">${pointsByOwner.get(t.ownerId) || 0}</span>
                </div>
                <div class="standing-card-stat">
                  <span class="standing-card-stat-label">Submitted Wk ${maxWeek}</span>
                  <span class="standing-card-stat-value">${submittedThisWeek.has(t.ownerId) ? "&#10003;" : "&mdash;"}</span>
                </div>
              </div>
            </div>
          `
        )
        .join("");

      container.innerHTML = `
        <p class="muted" style="margin-bottom: 12px;">
          1 point for every matchup pick that beats the spread — 2 points on Rivalry Weeks (Week 1 and Week
          ${lastRegularWeek()}). Graded through Week ${gradedThroughWeek || "—"}. "Submitted" reflects Week ${maxWeek}.
        </p>
        <div class="card table-wrap standings-table-wrap">
          <table>
            <thead>
              <tr>
                <th>Manager</th>
                <th class="num">Points</th>
                <th class="num">Submitted Wk ${maxWeek}</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
        <div class="standing-cards">${cards}</div>
      `;
    }

    // ---------- init ----------

    async function init() {
      const idx = await loadIndex();
      currentSeason = await loadSeason(idx.currentSeason);
      [allPlayers, rivalries] = await Promise.all([loadPlayers(), loadRivalries()]);

      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          try {
            await auth.signInAnonymously();
          } catch (err) {
            document.getElementById("pickem-root").innerHTML =
              '<div class="empty-state">Could not connect — try refreshing.</div>';
          }
          return; // onAuthStateChanged fires again once the anonymous user exists
        }
        currentUser = user;
        try {
          await resolveIdentityAndRender();
        } catch (err) {
          document.getElementById("pickem-root").innerHTML =
            '<div class="empty-state">Could not load league data. Try refreshing.</div>';
        }
      });
    }

    init().catch((err) => {
      console.error(err);
      document.getElementById("pickem-root").innerHTML = '<div class="empty-state">Could not load league data.</div>';
    });
  </script>
</body>
</html>
