<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pick-Em — Necessary Roughness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body data-page="pickem">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Necessary <span>Roughness</span></a>
      <nav class="main-nav">
        <a href="index.html" data-page="home">Home</a>
        <a href="standings.html" data-page="standings">Standings</a>
        <a href="matchups.html" data-page="matchups">Matchups</a>
        <a href="drafts.html" data-page="drafts">Drafts</a>
        <a href="transactions.html" data-page="transactions">Transactions</a>
        <a href="pickem.html" data-page="pickem">Pick-Em</a>
        <a href="info.html" data-page="info">Info</a>
        <a href="history.html" data-page="history">History</a>
      </nav>
    </div>
  </header>

  <div class="page">
    <main>
      <div id="pickem-root"></div>
    </main>
  </div>

  <script src="assets/js/data.js"></script>
  <script>
    // Real accounts + a real database (Firebase free tier) — this is the
    // one feature on an otherwise fully static/read-only site that needs
    // shared, multi-user, writable state: 12 managers submitting and
    // editing their own picks, with everyone seeing the same pool
    // standings. Firestore security rules (configured in the Firebase
    // console, not in this file) enforce that a signed-in user can only
    // ever write their own picks doc and their own identity doc.
    const firebaseConfig = {
      apiKey: "AIzaSyAwRdeJXzmPaInTH2rDMNriQfErQPj33yQ",
      authDomain: "necessaryroughness-5edd5.firebaseapp.com",
      projectId: "necessaryroughness-5edd5",
      storageBucket: "necessaryroughness-5edd5.firebasestorage.app",
      messagingSenderId: "104157286944",
      appId: "1:104157286944:web:1a3506b9062c4149ee2245",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentSeason = null;
    let allPlayers = null;
    let schedule = null;
    let currentUser = null;
    let identity = null; // {ownerId, rosterId, teamName}, from identities/{uid}
    let currentPicks = {};

    async function loadSchedule() {
      try {
        const res = await fetch("data/schedule.json");
        return await res.json();
      } catch {
        return [];
      }
    }

    // ---------- week gating ----------

    function lastRegularWeek() {
      return (currentSeason.leagueSettings?.playoffWeekStart ?? 15) - 1;
    }

    // A new week's picks unlock once the previous week has actually been
    // played — never further ahead than that, and never past the regular
    // season (no Pick-Em on playoff weeks).
    function unlockedThroughWeek() {
      const played = latestWeekWithData(currentSeason);
      const next = played == null ? 1 : played + 1;
      return Math.min(next, lastRegularWeek());
    }

    // ---------- schedule lookups ----------

    function opponentForPlayer(playerId, week) {
      const p = allPlayers[playerId];
      if (!p?.nflTeam || !schedule) return null;
      const game = schedule.find((g) => g.week === week && (g.home === p.nflTeam || g.away === p.nflTeam));
      if (!game) return null;
      const isHome = game.home === p.nflTeam;
      return { opp: isHome ? game.away : game.home, isHome, date: game.date };
    }

    function fmtGameDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr + "T12:00:00Z");
      return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
    }

    // ---------- auth gate ----------

    function renderAuthGate() {
      const root = document.getElementById("pickem-root");
      root.innerHTML = `
        <div class="pickem-auth-box">
          <div class="info-lead" style="text-align: center;">Sign in to make your Pick-Em picks</div>
          <div class="view-toggle" id="pickem-auth-mode" style="justify-content: center; margin: 14px 0;">
            <button type="button" data-mode="login" class="active">Log In</button>
            <button type="button" data-mode="signup">Sign Up</button>
          </div>
          <form id="pickem-auth-form" class="pickem-auth-form">
            <input type="email" id="pickem-email" placeholder="Email" required autocomplete="email" />
            <input type="password" id="pickem-password" placeholder="Password" required autocomplete="current-password" minlength="6" />
            <button type="submit" class="btn-primary">Log In</button>
          </form>
          <div id="pickem-auth-error" class="pickem-auth-error"></div>
        </div>
      `;

      let mode = "login";
      const modeToggle = root.querySelector("#pickem-auth-mode");
      const submitBtn = root.querySelector("#pickem-auth-form button[type=submit]");
      const passwordInput = root.querySelector("#pickem-password");

      modeToggle.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-mode]");
        if (!btn) return;
        mode = btn.dataset.mode;
        modeToggle.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
        submitBtn.textContent = mode === "signup" ? "Sign Up" : "Log In";
        passwordInput.autocomplete = mode === "signup" ? "new-password" : "current-password";
      });

      root.querySelector("#pickem-auth-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = root.querySelector("#pickem-email").value.trim();
        const password = passwordInput.value;
        const errEl = root.querySelector("#pickem-auth-error");
        errEl.textContent = "";
        submitBtn.disabled = true;
        try {
          if (mode === "signup") {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
          // onAuthStateChanged fires next and re-renders.
        } catch (err) {
          errEl.textContent = err.message || "Something went wrong.";
          submitBtn.disabled = false;
        }
      });
    }

    // ---------- team claim (first sign-in only) ----------

    async function renderTeamClaimPicker() {
      const root = document.getElementById("pickem-root");

      // If the manager already picked their team via the site-wide "which
      // team are you" bar, auto-claim that same team here instead of making
      // them pick again — unless it's already claimed by a different login.
      const siteId = loadSiteIdentity();
      if (siteId) {
        const team = teamById(currentSeason, siteId.rosterId);
        if (team) {
          const existing = await db.collection("identities").where("ownerId", "==", team.ownerId).get();
          if (existing.empty || existing.docs[0].id === currentUser.uid) {
            await db.collection("identities").doc(currentUser.uid).set({
              ownerId: team.ownerId,
              rosterId: team.rosterId,
              teamName: team.teamName,
            });
            identity = { ownerId: team.ownerId, rosterId: team.rosterId, teamName: team.teamName };
            renderMain();
            return;
          }
        }
      }

      const rows = currentSeason.teams
        .slice()
        .sort((a, b) => a.teamName.localeCompare(b.teamName))
        .map(
          (t) => `
            <div class="team-list-row" data-roster-id="${t.rosterId}" role="button" tabindex="0">
              ${avatarImgHTML(t)}
              <div class="team-list-info">
                <div class="team-name">${t.teamName}</div>
                <div class="team-list-owner">${t.displayName}</div>
              </div>
            </div>
          `
        )
        .join("");
      root.innerHTML = `
        <div class="info-lead" style="text-align: center; margin-bottom: 16px;">Which team are you?</div>
        <div class="team-box-list">${rows}</div>
        <div id="pickem-claim-error" class="pickem-auth-error" style="text-align: center;"></div>
        <button type="button" id="pickem-signout" class="link-btn" style="display: block; margin: 16px auto 0;">Sign out</button>
      `;
      root.querySelectorAll(".team-list-row").forEach((row) => {
        const pick = async () => {
          const team = teamById(currentSeason, Number(row.dataset.rosterId));
          const errEl = root.querySelector("#pickem-claim-error");
          errEl.textContent = "";
          const existing = await db.collection("identities").where("ownerId", "==", team.ownerId).get();
          if (!existing.empty && existing.docs[0].id !== currentUser.uid) {
            errEl.textContent = `${team.teamName} is already linked to another login. If that's wrong, ask the commissioner.`;
            return;
          }
          await db.collection("identities").doc(currentUser.uid).set({
            ownerId: team.ownerId,
            rosterId: team.rosterId,
            teamName: team.teamName,
          });
          identity = { ownerId: team.ownerId, rosterId: team.rosterId, teamName: team.teamName };
          renderMain();
        };
        row.addEventListener("click", pick);
        row.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            pick();
          }
        });
      });
      root.querySelector("#pickem-signout").addEventListener("click", () => auth.signOut());
    }

    // ---------- main shell ----------

    function renderMain() {
      const root = document.getElementById("pickem-root");
      root.innerHTML = `
        <div class="pickem-identity-bar">
          Playing as <strong>${identity.teamName}</strong> <span class="muted">(${currentUser.email})</span>
          <button type="button" id="pickem-logout" class="link-btn">Log Out</button>
        </div>
        <div class="view-toggle" id="pickem-tabs">
          <button type="button" data-tab="weeks">Weeks</button>
          <button type="button" data-tab="pool">Pool</button>
        </div>
        <div id="pickem-content"></div>
      `;
      root.querySelector("#pickem-logout").addEventListener("click", () => auth.signOut());

      const tabs = root.querySelector("#pickem-tabs");
      const params = new URLSearchParams(location.search);
      const initialTab = params.get("tab") === "pool" ? "pool" : "weeks";
      tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.tab === initialTab));

      tabs.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-tab]");
        if (!btn) return;
        tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
        const url = new URL(location.href);
        url.searchParams.set("tab", btn.dataset.tab);
        history.replaceState(null, "", url);
        showPickemTab(btn.dataset.tab);
      });

      showPickemTab(initialTab);
    }

    async function showPickemTab(tab) {
      const content = document.getElementById("pickem-content");
      content.innerHTML = `<div class="empty-state">Loading...</div>`;
      if (tab === "pool") await renderPoolTab(content);
      else await renderWeeksTab(content);
    }

    // ---------- weeks tab ----------

    async function renderWeeksTab(container) {
      const maxWeek = unlockedThroughWeek();
      const weeks = [];
      for (let w = 1; w <= maxWeek; w++) weeks.push(w);

      const params = new URLSearchParams(location.search);
      const requestedWeek = Number(params.get("week"));
      const initialWeek = weeks.includes(requestedWeek) ? requestedWeek : maxWeek;

      container.innerHTML = `
        <div class="controls">
          <select id="pickem-week-select">${weeks.map((w) => `<option value="${w}">Week ${w}</option>`).join("")}</select>
        </div>
        <div id="pickem-week-body"></div>
      `;

      const sel = container.querySelector("#pickem-week-select");
      sel.value = initialWeek;
      sel.addEventListener("change", () => {
        const url = new URL(location.href);
        url.searchParams.set("week", sel.value);
        history.replaceState(null, "", url);
        renderWeekBody(container.querySelector("#pickem-week-body"), Number(sel.value));
      });

      const url = new URL(location.href);
      url.searchParams.set("week", String(initialWeek));
      history.replaceState(null, "", url);

      await renderWeekBody(container.querySelector("#pickem-week-body"), initialWeek);
    }

    function matchupSpreadInfo(m) {
      const teamA = teamById(currentSeason, m.teamA.rosterId);
      const teamB = teamById(currentSeason, m.teamB.rosterId);
      const totalA = computeOptimalProjectedLineup(
        m.teamA.players,
        m.teamA.projByPlayer,
        allPlayers,
        currentSeason.rosterPositions
      );
      const totalB = computeOptimalProjectedLineup(
        m.teamB.players,
        m.teamB.projByPlayer,
        allPlayers,
        currentSeason.rosterPositions
      );
      const spread = Math.round(Math.abs(totalA - totalB) * 2) / 2;
      return { m, teamA, teamB, totalA, totalB, spread };
    }

    function picksDocId(ownerId, week) {
      return `${ownerId}_${week}`;
    }

    async function loadPicksDoc(ownerId, week) {
      const snap = await db.collection("picks").doc(picksDocId(ownerId, week)).get();
      return snap.exists ? snap.data() : null;
    }

    async function renderWeekBody(container, week) {
      container.innerHTML = `<div class="empty-state">Loading...</div>`;
      const existing = identity ? await loadPicksDoc(identity.ownerId, week) : null;
      currentPicks = existing && existing.picks ? { ...existing.picks } : {};

      const matchups = (currentSeason.matchups[week] || []).filter((m) => m.teamB);
      if (!matchups.length) {
        container.innerHTML = `<div class="empty-state">No matchups for this week.</div>`;
        return;
      }
      const matchupInfo = matchups.map(matchupSpreadInfo);

      container.innerHTML = `
        <div class="draft-list" id="pickem-matchups">${matchupInfo.map((info) => pickemMatchupCardHTML(info, week)).join("")}</div>
        <button type="button" id="pickem-submit" class="btn-primary" style="margin-top: 16px;">${
          existing ? "Update Picks" : "Submit Picks"
        }</button>
        <div id="pickem-submit-status" class="muted" style="margin-top: 8px;"></div>
      `;

      const list = container.querySelector("#pickem-matchups");

      list.querySelectorAll("[data-pick-roster]").forEach((el) => {
        el.addEventListener("click", () => {
          const matchupId = el.dataset.matchupId;
          currentPicks[matchupId] = Number(el.dataset.pickRoster);
          list
            .querySelectorAll(`[data-matchup-id="${matchupId}"][data-pick-roster]`)
            .forEach((x) => x.classList.toggle("selected", x === el));
          updateSubmitButtonState(container, matchupInfo);
        });
      });

      list.querySelectorAll("[data-expand-matchup]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const panel = list.querySelector(`#pickem-detail-${btn.dataset.expandMatchup}`);
          if (panel) panel.hidden = !panel.hidden;
        });
      });

      updateSubmitButtonState(container, matchupInfo);

      container.querySelector("#pickem-submit").addEventListener("click", () => submitPicks(container, week, matchupInfo));
    }

    function updateSubmitButtonState(container, matchupInfo) {
      const btn = container.querySelector("#pickem-submit");
      if (!btn) return;
      const allPicked = matchupInfo.every((info) => currentPicks[info.m.matchupId] != null);
      btn.disabled = !allPicked;
    }

    function pickemMatchupCardHTML(info, week) {
      const { m, teamA, teamB, totalA, totalB, spread } = info;
      const favA = totalA >= totalB;
      const lineA = spread === 0 ? "PICK'EM" : favA ? `-${spread.toFixed(1)}` : `+${spread.toFixed(1)}`;
      const lineB = spread === 0 ? "PICK'EM" : favA ? `+${spread.toFixed(1)}` : `-${spread.toFixed(1)}`;
      const pickedA = currentPicks[m.matchupId] === teamA.rosterId;
      const pickedB = currentPicks[m.matchupId] === teamB.rosterId;
      return `
        <div class="pickem-card">
          <div class="pickem-card-row">
            <div class="pickem-side${pickedA ? " selected" : ""}" data-matchup-id="${m.matchupId}" data-pick-roster="${teamA.rosterId}">
              ${teamCellHTML(teamA)}
              <div class="pickem-line">${lineA}</div>
            </div>
            <div class="pickem-vs">vs</div>
            <div class="pickem-side${pickedB ? " selected" : ""}" data-matchup-id="${m.matchupId}" data-pick-roster="${teamB.rosterId}">
              ${teamCellHTML(teamB)}
              <div class="pickem-line">${lineB}</div>
            </div>
          </div>
          <button type="button" class="pickem-expand-btn" data-expand-matchup="${m.matchupId}">View Rosters &amp; Projections</button>
          <div class="pickem-detail matchup-modal-columns" id="pickem-detail-${m.matchupId}" hidden>
            <div>${pickemRosterHTML(teamA, m.teamA, week)}</div>
            <div>${pickemRosterHTML(teamB, m.teamB, week)}</div>
          </div>
        </div>
      `;
    }

    function pickemPlayerRowHTML(playerId, week, isStarter) {
      const p = allPlayers[playerId];
      const name = p ? p.name : "Unknown Player";
      const meta = p ? [p.position, p.nflTeam].filter(Boolean).join(" &middot; ") : "";
      const opp = opponentForPlayer(playerId, week);
      const oppText = opp ? `${opp.isHome ? "vs" : "@"} ${nflAbbr3(opp.opp)} &middot; ${fmtGameDate(opp.date)}` : "Bye / N/A";
      return `
        <div class="pickem-player-row${isStarter ? " pickem-starter" : ""}">
          <span class="pickem-player-name">${playerLinkHTML(playerId, name)}${meta ? `<span class="player-meta">${meta}</span>` : ""}</span>
          <span class="pickem-player-opp">${oppText}</span>
        </div>
      `;
    }

    function pickemRosterHTML(team, side, week) {
      const starters = new Set(side.starters || []);
      const bench = (side.players || []).filter((pid) => !starters.has(pid));
      const rowsFor = (playerIds, isStarter) =>
        playerIds
          .map((pid) => {
            const proj = side.projByPlayer ? side.projByPlayer[pid] : null;
            const row = pickemPlayerRowHTML(pid, week, isStarter);
            return row.replace(
              "</div>",
              `<span class="info-stat-value proj-primary">${proj != null ? fmtPts(proj) : "—"}</span></div>`
            );
          })
          .join("");
      return `
        <div class="info-section-title">${team.teamName}</div>
        <div class="roster-group-title">Starters (${side.starters.length})</div>
        ${rowsFor(side.starters || [], true)}
        <div class="roster-group-title" style="margin-top: 10px;">Bench (${bench.length})</div>
        ${rowsFor(bench, false)}
      `;
    }

    async function submitPicks(container, week, matchupInfo) {
      const status = container.querySelector("#pickem-submit-status");
      if (!matchupInfo.every((info) => currentPicks[info.m.matchupId] != null)) {
        status.textContent = `Pick all ${matchupInfo.length} matchups before submitting.`;
        return;
      }

      status.textContent = "Saving...";
      try {
        await db
          .collection("picks")
          .doc(picksDocId(identity.ownerId, week))
          .set({
            uid: currentUser.uid,
            ownerId: identity.ownerId,
            week,
            picks: currentPicks,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
        status.textContent = "Picks saved!";
      } catch (err) {
        status.textContent = "Something went wrong saving — try again.";
      }
    }

    // ---------- pool tab ----------

    async function renderPoolTab(container) {
      const snap = await db.collection("picks").get();
      const allPicksDocs = snap.docs.map((d) => d.data());
      const maxWeek = unlockedThroughWeek();
      const gradedThroughWeek = latestWeekWithData(currentSeason) ?? 0;

      const pointsByOwner = new Map();
      const submittedThisWeek = new Set();

      for (const doc of allPicksDocs) {
        const week = Number(doc.week);
        if (week === maxWeek) submittedThisWeek.add(doc.ownerId);
        if (week > gradedThroughWeek) continue;
        if (!pointsByOwner.has(doc.ownerId)) pointsByOwner.set(doc.ownerId, 0);

        const matchups = (currentSeason.matchups[week] || []).filter((m) => m.teamB);
        for (const m of matchups) {
          const pickedRosterId = doc.picks ? doc.picks[m.matchupId] : null;
          if (pickedRosterId == null) continue;
          const { totalA, totalB, spread } = matchupSpreadInfo(m);
          const favIsA = totalA >= totalB;
          const actualMargin = favIsA ? m.teamA.points - m.teamB.points : m.teamB.points - m.teamA.points;
          let coveringRosterId = null;
          if (actualMargin > spread) coveringRosterId = favIsA ? m.teamA.rosterId : m.teamB.rosterId;
          else if (actualMargin < spread) coveringRosterId = favIsA ? m.teamB.rosterId : m.teamA.rosterId;
          if (coveringRosterId != null && pickedRosterId === coveringRosterId) {
            pointsByOwner.set(doc.ownerId, pointsByOwner.get(doc.ownerId) + 1);
          }
        }
      }

      const teams = currentSeason.teams
        .slice()
        .sort((a, b) => (pointsByOwner.get(b.ownerId) || 0) - (pointsByOwner.get(a.ownerId) || 0));

      const body = teams
        .map(
          (t) => `
            <tr>
              <td>${teamCellHTML(t)}</td>
              <td class="num">${pointsByOwner.get(t.ownerId) || 0}</td>
              <td class="num">${submittedThisWeek.has(t.ownerId) ? "&#10003;" : "&mdash;"}</td>
            </tr>
          `
        )
        .join("");

      container.innerHTML = `
        <p class="muted" style="margin-bottom: 12px;">
          1 point for every matchup pick that beats the spread. Graded through Week ${gradedThroughWeek || "—"}.
          "Submitted" reflects Week ${maxWeek}.
        </p>
        <div class="card table-wrap">
          <table>
            <thead>
              <tr>
                <th>Manager</th>
                <th class="num">Points</th>
                <th class="num">Submitted Wk ${maxWeek}</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    // ---------- init ----------

    async function init() {
      const idx = await loadIndex();
      currentSeason = await loadSeason(idx.currentSeason);
      [allPlayers, schedule] = await Promise.all([loadPlayers(), loadSchedule()]);

      auth.onAuthStateChanged(async (user) => {
        currentUser = user;
        if (!user) {
          identity = null;
          renderAuthGate();
          return;
        }
        try {
          const idDoc = await db.collection("identities").doc(user.uid).get();
          if (!idDoc.exists) {
            await renderTeamClaimPicker();
          } else {
            identity = idDoc.data();
            renderMain();
          }
        } catch (err) {
          document.getElementById("pickem-root").innerHTML =
            '<div class="empty-state">Could not load your account. Try refreshing.</div>';
        }
      });
    }

    init().catch((err) => {
      console.error(err);
      document.getElementById("pickem-root").innerHTML = '<div class="empty-state">Could not load league data.</div>';
    });
  </script>
</body>
</html>
