<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pick-Em — Necessary Roughness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body data-page="pickem">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Necessary <span>Roughness</span></a>
      <nav class="main-nav">
        <a href="index.html" data-page="home">Home</a>
        <a href="standings.html" data-page="standings">Standings</a>
        <a href="matchups.html" data-page="matchups">Matchups</a>
        <a href="drafts.html" data-page="drafts">Drafts</a>
        <a href="transactions.html" data-page="transactions">Transactions</a>
        <a href="pickem.html" data-page="pickem">Pick-Em</a>
        <a href="info.html" data-page="info">Info</a>
        <a href="history.html" data-page="history">History</a>
      </nav>
    </div>
  </header>

  <div class="page">
    <main>
      <div id="pickem-root"></div>
    </main>
  </div>

  <script src="assets/js/data.js"></script>
  <script>
    // A real database (Firebase free tier) — this is the one feature on an
    // otherwise fully static/read-only site that needs shared, multi-user,
    // writable state: 12 managers submitting and editing their own picks,
    // with everyone seeing the same pool standings. No visible sign-in —
    // every visitor is signed in anonymously behind the scenes purely so
    // Firestore's security rules have a stable request.auth.uid to check
    // (a signed-in browser can only write its own identity doc, and only
    // the picks doc for whatever team that identity doc claims). Which
    // team someone IS is just the site-wide "which team are you" pick
    // (assets/js/data.js), honor system from there on.
    const firebaseConfig = {
      apiKey: "AIzaSyAwRdeJXzmPaInTH2rDMNriQfErQPj33yQ",
      authDomain: "necessaryroughness-5edd5.firebaseapp.com",
      projectId: "necessaryroughness-5edd5",
      storageBucket: "necessaryroughness-5edd5.firebasestorage.app",
      messagingSenderId: "104157286944",
      appId: "1:104157286944:web:1a3506b9062c4149ee2245",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentSeason = null;
    let allPlayers = null;
    let rivalries = [];
    let currentUser = null;
    let identity = null; // {ownerId, rosterId, teamName}, from identities/{uid}
    let currentPicks = {};

    // Keeps the Pool tab's per-week matchup labels ("Team A vs Team B") to
    // one line inside a card.
    function truncName(name, max = 12) {
      if (!name) return "";
      return name.length > max ? name.slice(0, max - 1).trimEnd() + "…" : name;
    }

    // Sleeper's own CDN only holds this data for 60s, but nothing here ever
    // asked again after the initial render — so the "Currently Covering"
    // tag/Proj just froze at whatever it was when the page opened. Re-run
    // on an interval for whichever week is currently on screen.
    const LIVE_REFRESH_INTERVAL_MS = 30 * 1000;
    let liveCoverageTimer = null;

    function stopLiveCoverageRefresh() {
      if (liveCoverageTimer) clearInterval(liveCoverageTimer);
      liveCoverageTimer = null;
    }

    // ---------- week gating ----------

    function lastRegularWeek() {
      return (currentSeason.leagueSettings?.playoffWeekStart ?? 15) - 1;
    }

    // A new week's picks unlock once the previous week is officially over
    // — latestClosedWeek (data.js): fully played AND past its Tuesday
    // close-out — never further ahead than that, and never past the
    // regular season (no Pick-Em on playoff weeks). Same "officially over"
    // boundary Pick-Em grading uses, so the two always agree.
    async function unlockedThroughWeek() {
      const closed = await latestClosedWeek(currentSeason);
      const next = closed == null ? 1 : closed + 1;
      return Math.min(next, lastRegularWeek());
    }

    // ---------- kickoff lock ----------
    // Once a week's first game kicks off (minus a safety buffer), no new
    // picks or edits are accepted for it — "you snooze, you lose." Sleeper's
    // own schedule data (data/schedule.json) only has a date, not a kickoff
    // time, so this checks ESPN's public scoreboard API live, in the
    // browser, for the real kickoff timestamp — not the static, build-time
    // schedule snapshot.
    const LOCK_BUFFER_MS = 30 * 60 * 1000;
    const kickoffCache = new Map(); // week -> earliest kickoff (ms), or null if unknown

    async function firstKickoffForWeek(week) {
      if (kickoffCache.has(week)) return kickoffCache.get(week);
      let kickoff = null;
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        const res = await fetch(
          `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${week}&dates=${currentSeason.season}`,
          { signal: controller.signal }
        );
        clearTimeout(timeout);
        const data = await res.json();
        const times = (data.events || [])
          .map((e) => new Date(e.date).getTime())
          .filter((t) => !Number.isNaN(t));
        if (times.length) kickoff = Math.min(...times);
      } catch {
        // network hiccup / API unreachable — treat as unknown, fail open
      }
      kickoffCache.set(week, kickoff);
      return kickoff;
    }

    async function isWeekLocked(week) {
      const kickoff = await firstKickoffForWeek(week);
      if (kickoff == null) return false; // can't determine kickoff — don't block
      return (await trustedNow()) >= kickoff - LOCK_BUFFER_MS;
    }

    // ---------- team identity ----------

    // Shows the "which team are you?" picker directly in Pick-Em. Picking
    // a team here sets it as the site-wide identity too (assets/js/data.js)
    // so the rest of the site picks it up as well.
    function renderTeamPickerUI() {
      const root = document.getElementById("pickem-root");
      const rows = currentSeason.teams
        .slice()
        .sort((a, b) => a.teamName.localeCompare(b.teamName))
        .map(
          (t) => `
            <div class="team-list-row" data-roster-id="${t.rosterId}" role="button" tabindex="0">
              ${avatarImgHTML(t)}
              <div class="team-list-info">
                <div class="team-name">${t.teamName}</div>
                <div class="team-list-owner">${t.displayName}</div>
              </div>
            </div>
          `
        )
        .join("");
      root.innerHTML = `
        <div class="info-lead" style="text-align: center; margin-bottom: 16px;">Which team are you?</div>
        <div class="team-box-list">${rows}</div>
      `;
      root.querySelectorAll(".team-list-row").forEach((row) => {
        const pick = () => claimTeam(teamById(currentSeason, Number(row.dataset.rosterId)));
        row.addEventListener("click", pick);
        row.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            pick();
          }
        });
      });
    }

    async function claimTeam(team) {
      await db.collection("identities").doc(currentUser.uid).set({
        ownerId: team.ownerId,
        rosterId: team.rosterId,
        teamName: team.teamName,
      });
      saveSiteIdentity(team);
      refreshSiteIdentityBar();
      identity = { ownerId: team.ownerId, rosterId: team.rosterId, teamName: team.teamName };
      renderMain();
    }

    // Reconciles Pick-Em's Firestore identity with the site-wide "which
    // team are you" pick (localStorage). If no team's been picked anywhere
    // on the site yet, forces the picker here before anything else shows.
    async function resolveIdentityAndRender() {
      const siteId = loadSiteIdentity();
      if (siteId) {
        const team = teamById(currentSeason, siteId.rosterId);
        if (team) {
          const idDoc = await db.collection("identities").doc(currentUser.uid).get();
          if (idDoc.exists && idDoc.data().ownerId === team.ownerId) {
            identity = idDoc.data();
            renderMain();
          } else {
            await claimTeam(team);
          }
          return;
        }
      }
      renderTeamPickerUI();
    }

    // ---------- main shell ----------

    function renderMain() {
      const root = document.getElementById("pickem-root");
      root.innerHTML = `
        <div class="view-toggle" id="pickem-tabs">
          <button type="button" data-tab="weeks">Weeks</button>
          <button type="button" data-tab="pool">Pool</button>
        </div>
        <div id="pickem-content"></div>
      `;

      const tabs = root.querySelector("#pickem-tabs");
      const params = new URLSearchParams(location.search);
      const initialTab = params.get("tab") === "pool" ? "pool" : "weeks";
      tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.tab === initialTab));

      tabs.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-tab]");
        if (!btn) return;
        tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
        const url = new URL(location.href);
        url.searchParams.set("tab", btn.dataset.tab);
        history.replaceState(null, "", url);
        showPickemTab(btn.dataset.tab);
      });

      showPickemTab(initialTab);
    }

    async function showPickemTab(tab) {
      const content = document.getElementById("pickem-content");
      content.innerHTML = `<div class="empty-state">Loading...</div>`;
      if (tab === "pool") await renderPoolTab(content);
      else await renderWeeksTab(content);
    }

    // ---------- weeks tab ----------

    async function renderWeeksTab(container) {
      const maxWeek = await unlockedThroughWeek();
      const weeks = [];
      for (let w = 1; w <= maxWeek; w++) weeks.push(w);

      const params = new URLSearchParams(location.search);
      const requestedWeek = Number(params.get("week"));
      const initialWeek = weeks.includes(requestedWeek) ? requestedWeek : maxWeek;

      container.innerHTML = `
        <div class="controls">
          <select id="pickem-week-select">${weeks.map((w) => `<option value="${w}">Week ${w}</option>`).join("")}</select>
        </div>
        <div id="pickem-week-body"></div>
      `;

      const sel = container.querySelector("#pickem-week-select");
      sel.value = initialWeek;
      sel.addEventListener("change", () => {
        const url = new URL(location.href);
        url.searchParams.set("week", sel.value);
        history.replaceState(null, "", url);
        renderWeekBody(container.querySelector("#pickem-week-body"), Number(sel.value));
      });

      const url = new URL(location.href);
      url.searchParams.set("week", String(initialWeek));
      history.replaceState(null, "", url);

      await renderWeekBody(container.querySelector("#pickem-week-body"), initialWeek);
    }

    function picksDocId(ownerId, week) {
      return `${ownerId}_${week}`;
    }

    async function loadPicksDoc(ownerId, week) {
      const snap = await db.collection("picks").doc(picksDocId(ownerId, week)).get();
      return snap.exists ? snap.data() : null;
    }

    async function renderWeekBody(container, week) {
      container.innerHTML = `<div class="empty-state">Loading...</div>`;
      const [existing, counts, locked, closedThroughWeek] = await Promise.all([
        identity ? loadPicksDoc(identity.ownerId, week) : null,
        loadPickCounts(week),
        isWeekLocked(week),
        latestClosedWeek(currentSeason),
      ]);
      const closed = week <= (closedThroughWeek ?? 0);
      currentPicks = existing && existing.picks ? { ...existing.picks } : {};

      const matchups = (currentSeason.matchups[week] || []).filter((m) => m.teamB);
      if (!matchups.length) {
        container.innerHTML = `<div class="empty-state">No matchups for this week.</div>`;
        return;
      }
      // While a week's still open for picks, pull fresh Sleeper projections
      // on every load so the spread actually tracks real-world projection
      // moves — not just whatever the site's data was last built with.
      // Once it locks, fall back to the static/frozen snapshot below.
      const matchupInfo = locked
        ? matchups.map((m) => matchupSpreadInfo(currentSeason, allPlayers, m))
        : await Promise.all(matchups.map((m) => liveMatchupSpreadInfo(currentSeason, allPlayers, m, week)));
      if (locked) {
        // Freeze the spread everyone sees/is graded against at exactly what
        // it was the moment this week locked (30 min before kickoff) —
        // permanent in Firestore, so a later data refresh can't move it.
        await ensureLockedSpreadsSaved(currentSeason, week, matchupInfo);
        applyLockedSpreads(matchupInfo, await loadLockedSpreads(currentSeason, week));
      }
      const isRivalryWeek = week === 1 || week === lastRegularWeek();

      container.innerHTML = `
        ${
          isRivalryWeek
            ? `
              <div class="info-callout">
                <span class="info-callout-label">Rivalry Week</span>
                Correct spread picks count double this week — 2 points each instead of 1.
              </div>
            `
            : ""
        }
        ${
          closed
            ? `
              <div class="info-callout pickem-locked-callout">
                <span class="info-callout-label">Week Complete</span>
                Week ${week} is done and graded — here's how each matchup turned out, and which side you picked.
              </div>
            `
            : locked
            ? `
              <div class="info-callout pickem-locked-callout">
                <span class="info-callout-label">Picks Locked</span>
                The first game of Week ${week} has kicked off (or kicks off within 30 minutes) — no new picks or
                edits are accepted for this week anymore.
              </div>
            `
            : ""
        }
        <div class="draft-list${locked ? " pickem-locked" : ""}" id="pickem-matchups">${matchupInfo.map((info) => pickemMatchupCardHTML(info, week, counts, closed)).join("")}</div>
        <button type="button" id="pickem-submit" class="btn-primary" style="margin-top: 16px;"${locked ? " disabled" : ""}>${
          locked ? "Picks Locked" : existing ? "Update Picks" : "Submit Picks"
        }</button>
        <div id="pickem-submit-status" class="muted" style="margin-top: 8px;"></div>
      `;

      const list = container.querySelector("#pickem-matchups");

      if (!locked) {
        list.querySelectorAll("[data-pick-roster]").forEach((el) => {
          el.addEventListener("click", () => {
            const matchupId = el.dataset.matchupId;
            currentPicks[matchupId] = Number(el.dataset.pickRoster);
            list
              .querySelectorAll(`[data-matchup-id="${matchupId}"][data-pick-roster]`)
              .forEach((x) => x.classList.toggle("selected", x === el));
            updateSubmitButtonState(container, matchupInfo);
          });
        });
      }

      list.querySelectorAll("[data-view-rosters]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          openMatchupModal(currentSeason, week, Number(btn.dataset.t1), Number(btn.dataset.t2), { optimalLineup: true });
        });
      });

      applyLiveCoverage(list, week, matchupInfo);
      stopLiveCoverageRefresh();
      liveCoverageTimer = setInterval(() => {
        // The user's navigated elsewhere since this render (switched
        // weeks/tabs, submitted picks and re-rendered, ...) — this list
        // isn't on screen anymore, so stop patching it.
        if (!document.contains(list)) {
          stopLiveCoverageRefresh();
          return;
        }
        applyLiveCoverage(list, week, matchupInfo);
      }, LIVE_REFRESH_INTERVAL_MS);

      if (locked) return;

      updateSubmitButtonState(container, matchupInfo);

      container.querySelector("#pickem-submit").addEventListener("click", () => submitPicks(container, week, matchupInfo));
    }

    // Tags whichever side is CURRENTLY covering the shown spread, using
    // each side's live-blended total (blendedPlayerPoints, data.js — real
    // points for whoever's already played, projection for the rest) on
    // the same optimal-lineup basis the spread itself is built on. Only
    // shown once the matchup actually has live data — pregame the margin
    // is exactly the spread by construction, so there's no real signal
    // yet. Applies whether the week is locked or not — only skipped once
    // the week's fully done.
    async function applyLiveCoverage(list, week, matchupInfo) {
      // NOT weekFullyPlayed directly — a team can already show a nonzero,
      // plausible-looking total while one of its players is still actively
      // playing (most of the roster's games are already final, only
      // Monday night isn't), so that check alone goes true well before the
      // week is really over. latestClosedWeek also requires being past the
      // week's actual Tuesday close-out.
      const closed = (await latestClosedWeek(currentSeason)) ?? 0;
      if (week <= closed) return;
      const [liveMatchups, liveProjections, teamStatusByTeam] = await Promise.all([
        loadLiveMatchups(currentSeason.leagueId, week),
        loadLiveWeeklyProjections(currentSeason, week),
        loadLiveGameStatusByTeam(currentSeason.season, week),
      ]);
      if (!liveProjections) return;

      const livePlayerPoints = {};
      if (liveMatchups) liveMatchups.forEach((r) => Object.assign(livePlayerPoints, r.players_points || {}));

      // blendedPlayerPoints (data.js): real final once a player's game is
      // actually over, their live pace or projection (whichever's higher)
      // while still mid-game, plain projection before kickoff — NOT just
      // "any live points means done," which understates anyone still
      // playing.
      const blendedFor = (playerIds) => {
        const out = {};
        for (const pid of playerIds || []) {
          out[pid] = blendedPlayerPoints(pid, livePlayerPoints, liveProjections, allPlayers, teamStatusByTeam, currentSeason.scoringSettings);
        }
        return out;
      };

      // Before lock, the spread and the projection shown next to it are both
      // built on each roster's best-possible lineup. Once the week locks,
      // grading is on what each team actually starts, so switch to the real
      // Sleeper lineups — same starters + blend the Matchups page uses (live
      // starters from Sleeper's matchups feed, since the data.json snapshot
      // can lag a lineup change).
      const locked = await isWeekLocked(week);
      const liveStartersByRoster = new Map();
      if (liveMatchups) liveMatchups.forEach((r) => liveStartersByRoster.set(r.roster_id, r.starters));
      const startersFor = (side) => liveStartersByRoster.get(side.rosterId) || side.starters || [];
      const totalFor = (side) =>
        locked
          ? startersFor(side).reduce((sum, pid) => sum + (blendedFor([pid])[pid] ?? 0), 0)
          : computeOptimalProjectedLineup(side.players, blendedFor(side.players), allPlayers, currentSeason.rosterPositions).total;

      matchupInfo.forEach((info) => {
        const { m, teamA, teamB, spread, favRosterId } = info;
        const totalA = totalFor(m.teamA);
        const totalB = totalFor(m.teamB);
        const favIsA = favRosterId === teamA.rosterId;

        const elA = list.querySelector(`[data-matchup-id="${m.matchupId}"][data-pick-roster="${teamA.rosterId}"]`);
        const elB = list.querySelector(`[data-matchup-id="${m.matchupId}"][data-pick-roster="${teamB.rosterId}"]`);
        // Keep the displayed "Proj" in step with the totals "currently
        // covering" is actually computed from.
        const projElA = elA?.querySelector(".pickem-proj");
        if (projElA) projElA.textContent = `Proj ${fmtPts(totalA)}`;
        const projElB = elB?.querySelector(".pickem-proj");
        if (projElB) projElB.textContent = `Proj ${fmtPts(totalB)}`;

        // "Currently Covering" only once this matchup actually has live
        // data — pregame the margin is (by construction) exactly the
        // spread itself, so calling a side "covering" would just be
        // noise from rounding, not a real signal.
        const rosterHasLive = (ids) => (ids || []).some((pid) => livePlayerPoints[pid] > 0);
        const isLive = rosterHasLive(m.teamA.players) || rosterHasLive(m.teamB.players);
        elA?.querySelector(".pickem-currently-covering")?.remove();
        elB?.querySelector(".pickem-currently-covering")?.remove();
        if (!isLive) return;
        const actualMargin = favIsA ? totalA - totalB : totalB - totalA;
        let coveringEl = null;
        if (actualMargin > spread) coveringEl = favIsA ? elA : elB;
        else if (actualMargin < spread) coveringEl = favIsA ? elB : elA;
        coveringEl?.insertAdjacentHTML("beforeend", `<div class="pickem-currently-covering">Currently Covering</div>`);
      });
    }

    function updateSubmitButtonState(container, matchupInfo) {
      const btn = container.querySelector("#pickem-submit");
      if (!btn) return;
      const allPicked = matchupInfo.every((info) => currentPicks[info.m.matchupId] != null);
      btn.disabled = !allPicked;
    }

    // Who actually covered a matchup's locked spread, from real final
    // points — same grading math computePickEmPoints (data.js) uses. null
    // for a push (margin exactly equals the spread). Shared by the
    // matchup cards and the Pool tab's per-week breakdown.
    function coveringRosterIdFor(info) {
      const { m, teamA, teamB, spread, favRosterId } = info;
      const favA = favRosterId === teamA.rosterId;
      const actualMargin = favA ? m.teamA.points - m.teamB.points : m.teamB.points - m.teamA.points;
      if (actualMargin > spread) return favA ? teamA.rosterId : teamB.rosterId;
      if (actualMargin < spread) return favA ? teamB.rosterId : teamA.rosterId;
      return null;
    }

    function pickemMatchupCardHTML(info, week, counts, closed) {
      const { m, teamA, teamB, totalA, totalB, spread, favRosterId } = info;
      const favA = favRosterId === teamA.rosterId;
      const lineA = spread === 0 ? "PICK'EM" : favA ? `-${spread.toFixed(1)}` : `+${spread.toFixed(1)}`;
      const lineB = spread === 0 ? "PICK'EM" : favA ? `+${spread.toFixed(1)}` : `-${spread.toFixed(1)}`;
      const pickedA = currentPicks[m.matchupId] === teamA.rosterId;
      const pickedB = currentPicks[m.matchupId] === teamB.rosterId;
      const matchupCounts = counts ? counts[m.matchupId] : null;
      const countA = matchupCounts ? matchupCounts[teamA.rosterId] || 0 : null;
      const countB = matchupCounts ? matchupCounts[teamB.rosterId] || 0 : null;

      // Once the week's officially closed, show the real final score
      // instead of the (now moot) projection, and who actually covered
      // the locked spread.
      const coveringRosterId = closed ? coveringRosterIdFor(info) : null;
      const pointsLabelA = closed ? fmtPts(m.teamA.points) : `Proj ${fmtPts(totalA)}`;
      const pointsLabelB = closed ? fmtPts(m.teamB.points) : `Proj ${fmtPts(totalB)}`;
      const coveredTagA = closed && coveringRosterId === teamA.rosterId ? `<div class="pickem-currently-covering">Covered</div>` : "";
      const coveredTagB = closed && coveringRosterId === teamB.rosterId ? `<div class="pickem-currently-covering">Covered</div>` : "";

      // Same rivalry theming as the Matchups page — Week 1 and the last
      // regular-season week only, and only for 2025+ (when Rivalry Week
      // started).
      const rivalry =
        parseInt(currentSeason.season, 10) >= 2025 ? findRivalry(rivalries, teamA.ownerId, teamB.ownerId) : null;
      const isRivalryWeek = week === 1 || week === lastRegularWeek();
      const showRivalry = !!(rivalry && isRivalryWeek);
      const rivalryStyle = showRivalry && rivalry.color ? ` style="--rivalry-color: ${rivalry.color};"` : "";

      return `
        <div class="pickem-card${showRivalry ? " rivalry-matchup" : ""}"${rivalryStyle}>
          ${showRivalry ? `<div class="rivalry-banner">${rivalry.name}</div>` : ""}
          <div class="pickem-card-row">
            <div class="pickem-side${pickedA ? " selected" : ""}" data-matchup-id="${m.matchupId}" data-pick-roster="${teamA.rosterId}">
              ${teamCellHTML(teamA)}
              <div class="pickem-proj">${pointsLabelA}</div>
              <div class="pickem-line">${lineA}</div>
              ${coveredTagA}
              ${countA != null ? `<div class="pick-count">${countA} picked</div>` : ""}
            </div>
            <div class="pickem-vs">vs</div>
            <div class="pickem-side${pickedB ? " selected" : ""}" data-matchup-id="${m.matchupId}" data-pick-roster="${teamB.rosterId}">
              ${teamCellHTML(teamB)}
              <div class="pickem-proj">${pointsLabelB}</div>
              <div class="pickem-line">${lineB}</div>
              ${coveredTagB}
              ${countB != null ? `<div class="pick-count">${countB} picked</div>` : ""}
            </div>
          </div>
          <button type="button" class="pickem-expand-btn" data-view-rosters data-t1="${teamA.rosterId}" data-t2="${teamB.rosterId}">View Rosters &amp; ${closed ? "Scores" : "Projections"}</button>
        </div>
      `;
    }

    async function submitPicks(container, week, matchupInfo) {
      const status = container.querySelector("#pickem-submit-status");
      if (!matchupInfo.every((info) => currentPicks[info.m.matchupId] != null)) {
        status.textContent = `Pick all ${matchupInfo.length} matchups before submitting.`;
        return;
      }

      // Re-check the lock right before saving — the page may have been sitting
      // open since before kickoff.
      if (await isWeekLocked(week)) {
        await renderWeekBody(container, week);
        return;
      }

      status.textContent = "Saving...";
      try {
        await db
          .collection("picks")
          .doc(picksDocId(identity.ownerId, week))
          .set({
            uid: currentUser.uid,
            ownerId: identity.ownerId,
            week,
            picks: currentPicks,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
        status.textContent = "Picks saved!";
      } catch (err) {
        status.textContent = "Something went wrong saving — try again.";
      }
    }

    // ---------- pool tab ----------

    async function renderPoolTab(container) {
      const maxWeek = await unlockedThroughWeek();
      const gradedThroughWeek = latestWeekWithData(currentSeason) ?? 0;
      // Week By Week only makes sense for a week that's actually closed —
      // the current, still-open week has no real result to show yet (it's
      // already covered by the "Submitted" column above).
      const closedThroughWeek = (await latestClosedWeek(currentSeason)) ?? 0;

      const [pointsByOwner, submittedSnap] = await Promise.all([
        computePickEmPoints(currentSeason, allPlayers),
        db.collection("picks").where("week", "==", maxWeek).get(),
      ]);
      const submittedThisWeek = new Set(submittedSnap.docs.map((d) => d.data().ownerId));

      const teams = currentSeason.teams
        .slice()
        .sort((a, b) => (pointsByOwner.get(b.ownerId) || 0) - (pointsByOwner.get(a.ownerId) || 0));

      const body = teams
        .map(
          (t) => `
            <tr>
              <td>${teamCellHTML(t)}</td>
              <td class="num">${pointsByOwner.get(t.ownerId) || 0}</td>
              <td class="num">${submittedThisWeek.has(t.ownerId) ? "&#10003;" : "&mdash;"}</td>
            </tr>
          `
        )
        .join("");

      const cards = teams
        .map(
          (t) => `
            <div class="standing-card">
              <div class="standing-card-top">
                ${teamCellHTML(t)}
              </div>
              <div class="standing-card-stats">
                <div class="standing-card-stat">
                  <span class="standing-card-stat-label">Points</span>
                  <span class="standing-card-stat-value">${pointsByOwner.get(t.ownerId) || 0}</span>
                </div>
                <div class="standing-card-stat">
                  <span class="standing-card-stat-label">Submitted Wk ${maxWeek}</span>
                  <span class="standing-card-stat-value">${submittedThisWeek.has(t.ownerId) ? "&#10003;" : "&mdash;"}</span>
                </div>
              </div>
            </div>
          `
        )
        .join("");

      container.innerHTML = `
        <p class="muted" style="margin-bottom: 12px;">
          1 point for every matchup pick that beats the spread — 2 points on Rivalry Weeks (Week 1 and Week
          ${lastRegularWeek()}). Graded through Week ${gradedThroughWeek || "—"}. "Submitted" reflects Week ${maxWeek}.
        </p>
        <div class="card table-wrap standings-table-wrap">
          <table>
            <thead>
              <tr>
                <th>Manager</th>
                <th class="num">Points</th>
                <th class="num">Submitted Wk ${maxWeek}</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>
        <div class="standing-cards">${cards}</div>

        <div class="info-section-title" style="margin-top: 24px;">Week By Week</div>
        ${
          closedThroughWeek > 0
            ? `
              <div class="controls">
                <select id="pool-week-select">${Array.from({ length: closedThroughWeek }, (_, i) => closedThroughWeek - i)
                  .map((w) => `<option value="${w}">Week ${w}</option>`)
                  .join("")}</select>
              </div>
              <div id="pool-week-detail"></div>
            `
            : `<div class="empty-state">No completed weeks yet.</div>`
        }
      `;

      if (closedThroughWeek > 0) {
        const poolWeekSelect = container.querySelector("#pool-week-select");
        poolWeekSelect.addEventListener("change", () => renderPoolWeekDetail(Number(poolWeekSelect.value)));
        await renderPoolWeekDetail(closedThroughWeek);
      }
    }

    // Everyone's picks for one specific week — same vertical stacked-card
    // layout as the Standings cards, one card per manager: their points
    // earned that week, and which side they picked in every matchup, with
    // a check/x once the week's closed and there's a real result to grade
    // against. Sorted by that week's points once closed (a mini
    // leaderboard for the week); alphabetically before that, since points
    // aren't real yet.
    async function renderPoolWeekDetail(week) {
      const container = document.getElementById("pool-week-detail");
      container.innerHTML = `<div class="empty-state">Loading...</div>`;

      const matchups = (currentSeason.matchups[week] || []).filter((m) => m.teamB);
      const picksSnap = await db.collection("picks").where("week", "==", week).get();

      // renderPoolWeekDetail only ever runs for an already-closed week (see
      // renderPoolTab's week-select, capped at closedThroughWeek) — so the
      // spread is always locked and there's always a real result to grade.
      const matchupInfo = matchups.map((m) => matchupSpreadInfo(currentSeason, allPlayers, m));
      applyLockedSpreads(matchupInfo, await loadLockedSpreads(currentSeason, week));
      const coveringByMatchupId = new Map();
      matchupInfo.forEach((info) => coveringByMatchupId.set(info.m.matchupId, coveringRosterIdFor(info)));

      const picksByOwner = new Map();
      picksSnap.docs.forEach((d) => picksByOwner.set(d.data().ownerId, d.data().picks || {}));
      const isRivalryWeek = week === 1 || week === lastRegularWeek();
      const pointValue = isRivalryWeek ? 2 : 1;

      // Rivalry Week started in 2025 — every matchup that week is a
      // designated rivalry, so its name/color replaces the plain "Team A
      // vs Team B" label, same theming as the matchup cards themselves.
      const rivalryByMatchupId = new Map();
      if (isRivalryWeek && parseInt(currentSeason.season, 10) >= 2025) {
        matchupInfo.forEach((info) => {
          const rivalry = findRivalry(rivalries, info.teamA.ownerId, info.teamB.ownerId);
          if (rivalry) rivalryByMatchupId.set(info.m.matchupId, rivalry);
        });
      }

      const teamsWithPoints = currentSeason.teams.map((t) => {
        const picks = picksByOwner.get(t.ownerId) || null;
        let weekPoints = 0;
        if (picks) {
          matchupInfo.forEach((info) => {
            const pickedRosterId = picks[info.m.matchupId];
            if (pickedRosterId != null && coveringByMatchupId.get(info.m.matchupId) === pickedRosterId) {
              weekPoints += pointValue;
            }
          });
        }
        return { team: t, picks, weekPoints };
      });
      teamsWithPoints.sort((a, b) => b.weekPoints - a.weekPoints);

      const cardsHTML = teamsWithPoints
        .map(({ team, picks, weekPoints }) => {
          const matchupRows = matchupInfo
            .map((info) => {
              const { m, teamA, teamB } = info;
              const rivalry = rivalryByMatchupId.get(m.matchupId);
              const label = rivalry
                ? `<span${rivalry.color ? ` style="color: ${rivalry.color};"` : ""}>${rivalry.name}</span>`
                : `${truncName(teamA.teamName)} vs ${truncName(teamB.teamName)}`;
              const pickedRosterId = picks ? picks[m.matchupId] : null;
              const pickedTeam = pickedRosterId != null ? teamById(currentSeason, pickedRosterId) : null;
              let valueHTML = pickedTeam ? truncName(pickedTeam.teamName) : "&mdash;";
              if (pickedRosterId != null) {
                const covering = coveringByMatchupId.get(m.matchupId);
                if (covering != null) {
                  const correct = covering === pickedRosterId;
                  valueHTML += correct
                    ? ` <span class="pickem-result-correct">${CHECK_SVG}</span>`
                    : ` <span class="pickem-result-incorrect">${X_SVG}</span>`;
                  const earned = correct ? pointValue : 0;
                  valueHTML += ` <span class="pickem-points-delta ${correct ? "pickem-result-correct" : "pickem-result-incorrect"}">+${earned}</span>`;
                }
              }
              return `
                <div class="standing-card-stat">
                  <span class="standing-card-stat-label">${label}</span>
                  <span class="standing-card-stat-value">${valueHTML}</span>
                </div>
              `;
            })
            .join("");
          return `
            <div class="standing-card">
              <div class="standing-card-top">
                ${teamCellHTML(team)}
              </div>
              <div class="standing-card-stats">
                <div class="standing-card-stat standing-card-stat-full">
                  <span class="standing-card-stat-label">Points This Week</span>
                  <span class="standing-card-stat-value">${weekPoints}</span>
                </div>
                ${matchupRows}
              </div>
            </div>
          `;
        })
        .join("");

      container.innerHTML = `
        ${
          isRivalryWeek
            ? `
              <div class="info-callout">
                <span class="info-callout-label">Rivalry Week</span>
                Correct spread picks counted double this week — 2 points each instead of 1.
              </div>
            `
            : ""
        }
        <div class="team-box-list">${cardsHTML}</div>
      `;
    }

    // ---------- init ----------

    async function init() {
      const idx = await loadIndex();
      currentSeason = await loadSeason(idx.currentSeason);
      [allPlayers, rivalries] = await Promise.all([loadPlayers(), loadRivalries()]);

      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          try {
            await auth.signInAnonymously();
          } catch (err) {
            document.getElementById("pickem-root").innerHTML =
              '<div class="empty-state">Could not connect — try refreshing.</div>';
          }
          return; // onAuthStateChanged fires again once the anonymous user exists
        }
        currentUser = user;
        try {
          await resolveIdentityAndRender();
        } catch (err) {
          document.getElementById("pickem-root").innerHTML =
            '<div class="empty-state">Could not load league data. Try refreshing.</div>';
        }
      });
    }

    init().catch((err) => {
      console.error(err);
      document.getElementById("pickem-root").innerHTML = '<div class="empty-state">Could not load league data.</div>';
    });
  </script>
</body>
</html>
