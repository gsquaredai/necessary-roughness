<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drafts — Necessary Roughness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="drafts">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Necessary <span>Roughness</span></a>
      <nav class="main-nav">
        <a href="index.html" data-page="home">Home</a>
        <a href="standings.html" data-page="standings">Standings</a>
        <a href="matchups.html" data-page="matchups">Matchups</a>
        <a href="drafts.html" data-page="drafts">Drafts</a>
        <a href="history.html" data-page="history">History</a>
      </nav>
    </div>
  </header>

  <div class="page">
    <main>
      <div class="controls">
        <select id="season-select"></select>
      </div>

      <section>
        <div id="draft-rounds"></div>
      </section>
    </main>
  </div>

  <script src="assets/js/data.js"></script>
  <script>
    async function init() {
      const idx = await loadIndex();
      const select = document.getElementById("season-select");
      select.innerHTML = idx.seasons
        .slice()
        .reverse()
        .map((s) => `<option value="${s}">${s} Season</option>`)
        .join("");

      const requested = new URLSearchParams(location.search).get("season");
      select.value = idx.seasons.includes(requested) ? requested : idx.currentSeason;

      select.addEventListener("change", () => {
        const url = new URL(location.href);
        url.searchParams.set("season", select.value);
        history.replaceState(null, "", url);
        renderDraft(select.value);
      });
      await renderDraft(select.value);
    }

    async function renderDraft(seasonKey) {
      const season = await loadSeason(seasonKey);
      const container = document.getElementById("draft-rounds");

      if (!season.draft || !season.draft.picks.length) {
        container.innerHTML = '<div class="empty-state">No draft data for this season.</div>';
        return;
      }

      const teamsPerRound = Math.round(season.draft.picks.length / season.draft.rounds);
      const byRound = new Map();
      for (const pick of season.draft.picks) {
        if (!byRound.has(pick.round)) byRound.set(pick.round, []);
        byRound.get(pick.round).push(pick);
      }

      container.innerHTML = [...byRound.entries()]
        .map(([round, picks]) => {
          const cards = picks
            .map((pick) => {
              const team = teamById(season, pick.rosterId);
              const pickInRound = ((pick.pickNo - 1) % teamsPerRound) + 1;
              return `
                <div class="draft-pick">
                  <div class="draft-pick-no">${round}.${String(pickInRound).padStart(2, "0")}</div>
                  <div class="draft-pick-team">${team ? teamCellHTML(team) : '<span class="muted">Unknown</span>'}</div>
                  <div class="draft-pick-player">
                    <span class="player-name">${pick.playerName}</span>
                    ${
                      pick.position
                        ? `<span class="player-meta">${pick.position}${pick.nflTeam ? " · " + pick.nflTeam : ""}</span>`
                        : ""
                    }
                  </div>
                </div>
              `;
            })
            .join("");
          return `
            <div class="draft-round">
              <h2>Round ${round}</h2>
              <div class="draft-pick-grid">${cards}</div>
            </div>
          `;
        })
        .join("");
    }

    init().catch((err) => {
      console.error(err);
      document.getElementById("draft-rounds").innerHTML =
        '<div class="empty-state">Could not load league data.</div>';
    });
  </script>
</body>
</html>
