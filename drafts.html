<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drafts — Necessary Roughness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="drafts">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Necessary <span>Roughness</span></a>
      <nav class="main-nav">
        <a href="index.html" data-page="home">Home</a>
        <a href="standings.html" data-page="standings">Standings</a>
        <a href="matchups.html" data-page="matchups">Matchups</a>
        <a href="drafts.html" data-page="drafts">Drafts</a>
        <a href="transactions.html" data-page="transactions">Transactions</a>
        <a href="pickem.html" data-page="pickem">Pick-Em</a>
        <a href="info.html" data-page="info">Info</a>
        <a href="history.html" data-page="history">History</a>
      </nav>
    </div>
  </header>

  <div class="page">
    <main>
      <div class="controls">
        <select id="season-select"></select>
        <select id="team-select"></select>
      </div>

      <section>
        <div id="draft-list" class="draft-list"></div>
      </section>
    </main>
  </div>

  <script src="assets/js/data.js"></script>
  <script>
    let currentSeason = null;

    async function init() {
      const idx = await loadIndex();
      const select = document.getElementById("season-select");
      select.innerHTML = idx.seasons
        .slice()
        .reverse()
        .map((s) => `<option value="${s}">${s} Season</option>`)
        .join("");

      const params = new URLSearchParams(location.search);
      const requested = params.get("season");
      select.value = idx.seasons.includes(requested) ? requested : idx.currentSeason;
      const requestedTeam = params.get("team") || "";
      const requestedPickNo = params.get("pickNo") ? Number(params.get("pickNo")) : null;

      const teamSelect = document.getElementById("team-select");

      function updateUrl() {
        const url = new URL(location.href);
        url.searchParams.set("season", select.value);
        if (teamSelect.value) url.searchParams.set("team", teamSelect.value);
        else url.searchParams.delete("team");
        history.replaceState(null, "", url);
      }

      select.addEventListener("change", () => {
        teamSelect.value = ""; // reset before updateUrl reads it, so a stale team id doesn't linger in the URL
        updateUrl();
        renderDraft(select.value, "");
      });
      teamSelect.addEventListener("change", () => {
        updateUrl();
        renderRows(teamSelect.value);
      });

      await renderDraft(select.value, requestedTeam);

      if (requestedPickNo != null) {
        // A pick-info popup deep-link always targets the full board, not a
        // team-filtered view, so the row is guaranteed to be there.
        document.getElementById("team-select").value = "";
        renderRows("");
        jumpToPick(requestedPickNo);
      }
    }

    function jumpToPick(pickNo) {
      const row = document.querySelector(`.draft-pick-row[data-pick-no="${pickNo}"]`);
      if (!row) return;
      row.scrollIntoView({ behavior: "smooth", block: "center" });
      const panel = document.getElementById("history-" + row.dataset.pickIdx);
      if (panel) {
        panel.hidden = false;
        row.classList.add("expanded");
      }
      row.classList.add("pick-highlight");
      setTimeout(() => row.classList.remove("pick-highlight"), 2600);
    }

    async function renderDraft(seasonKey, requestedTeam) {
      const season = await loadSeason(seasonKey);
      currentSeason = season;
      const container = document.getElementById("draft-list");
      const teamSelect = document.getElementById("team-select");

      if (!season.draft || !season.draft.picks.length) {
        teamSelect.innerHTML = "";
        container.innerHTML = '<div class="empty-state">No draft data for this season.</div>';
        return;
      }

      const teamsByOwner = new Map();
      for (const pick of season.draft.picks) {
        const team = pick.teamOverride || teamById(season, pick.rosterId);
        if (team?.ownerId && !teamsByOwner.has(team.ownerId)) teamsByOwner.set(team.ownerId, team.teamName);
      }
      const teamOptions = [...teamsByOwner.entries()].sort((a, b) => a[1].localeCompare(b[1]));
      teamSelect.innerHTML =
        `<option value="">All Teams</option>` +
        teamOptions.map(([ownerId, name]) => `<option value="${ownerId}">${name}</option>`).join("");
      teamSelect.value = teamsByOwner.has(requestedTeam) ? requestedTeam : "";

      renderRows(teamSelect.value);
    }

    function renderRows(teamFilter) {
      const season = currentSeason;
      const container = document.getElementById("draft-list");
      const POSITION_CLASS = { QB: "pos-qb", RB: "pos-rb", WR: "pos-wr", TE: "pos-te" };
      const teamsPerRound = Math.round(season.draft.picks.length / season.draft.rounds);

      const picks = season.draft.picks.filter((pick) => {
        if (!teamFilter) return true;
        const team = pick.teamOverride || teamById(season, pick.rosterId);
        return team?.ownerId === teamFilter;
      });

      if (!picks.length) {
        container.innerHTML = '<div class="empty-state">No picks for that team.</div>';
        return;
      }

      container.innerHTML = picks
        .map((pick, i) => {
          const team = pick.teamOverride || teamById(season, pick.rosterId);
          const posClass = POSITION_CLASS[pick.position] || "pos-other";
          const hasHistory = pick.tradeHistory && pick.tradeHistory.length > 0;
          const pickInRound = ((pick.pickNo - 1) % teamsPerRound) + 1;
          return `
            <div class="draft-pick-row ${posClass}" data-pick-idx="${i}" data-pick-no="${pick.pickNo}" role="button" tabindex="0">
              <div class="draft-pick-no pick-link" data-pick-id="${season.season}-${pick.round}-${pick.originalRosterId}">
                ${pick.pickNo}
                <span class="draft-pick-round">(${pick.round}.${String(pickInRound).padStart(2, "0")})</span>
              </div>
              <div class="draft-pick-team">${team ? teamCellHTML(team) : '<span class="muted">Unknown</span>'}</div>
              <div class="draft-pick-player">
                <span class="player-name">${playerLinkHTML(pick.playerId, pick.playerName)}</span>
                ${pick.position ? `<span class="player-meta">${pick.position}</span>` : ""}
              </div>
              <div class="draft-pick-nfl">
                ${nflLogoImgHTML(pick.nflTeam)}
                <span class="nfl-team-abbr">${pick.nflTeam ? nflAbbr3(pick.nflTeam) : "—"}</span>
              </div>
              <div class="draft-pick-expand">${hasHistory ? "&gt;" : ""}</div>
            </div>
            <div class="draft-pick-history" id="history-${i}" hidden>
              ${renderPickHistory(season, pick)}
            </div>
          `;
        })
        .join("");

      container.querySelectorAll(".draft-pick-row").forEach((row) => {
        row.addEventListener("click", () => togglePickHistory(row));
        row.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            togglePickHistory(row);
          }
        });
      });
    }

    function togglePickHistory(row) {
      const panel = document.getElementById("history-" + row.dataset.pickIdx);
      if (!panel) return;
      panel.hidden = !panel.hidden;
      row.classList.toggle("expanded", !panel.hidden);
    }

    function renderPickHistory(season, pick) {
      const original = pick.teamOverride || teamById(season, pick.originalRosterId ?? pick.rosterId);
      const emptyText = `Never traded — held by ${
        original ? original.teamName : "the original team"
      } since the draft order was set.`;
      return renderTradeHopsHTML(pick.tradeHistory, emptyText);
    }

    init().catch((err) => {
      console.error(err);
      document.getElementById("draft-list").innerHTML =
        '<div class="empty-state">Could not load league data.</div>';
    });
  </script>
</body>
</html>
