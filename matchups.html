<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matchups — Necessary Roughness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="matchups">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Necessary <span>Roughness</span></a>
      <nav class="main-nav">
        <a href="index.html" data-page="home">Home</a>
        <a href="standings.html" data-page="standings">Standings</a>
        <a href="matchups.html" data-page="matchups">Matchups</a>
        <a href="drafts.html" data-page="drafts">Drafts</a>
        <a href="transactions.html" data-page="transactions">Transactions</a>
        <a href="info.html" data-page="info">Info</a>
        <a href="history.html" data-page="history">History</a>
      </nav>
    </div>
  </header>

  <div class="page">
    <main>
      <div class="controls">
        <select id="season-select"></select>
        <select id="week-select"></select>
      </div>

      <section>
        <div class="matchup-grid" id="matchups-list"></div>
      </section>
    </main>
  </div>

  <script src="assets/js/data.js"></script>
  <script>
    let currentSeason = null;
    let rivalries = [];
    let weeklyRecords = null; // Map week -> { median, teams: { [rosterId]: {...} } }
    let lastRegularWeek = 14;

    async function init() {
      const idx = await loadIndex();
      rivalries = await loadRivalries();
      const seasonSelect = document.getElementById("season-select");
      seasonSelect.innerHTML = idx.seasons
        .slice()
        .reverse()
        .map((s) => `<option value="${s}">${s} Season</option>`)
        .join("");
      seasonSelect.value = idx.currentSeason;

      seasonSelect.addEventListener("change", () => loadSeasonInto(seasonSelect.value));
      await loadSeasonInto(seasonSelect.value);

      document.getElementById("week-select").addEventListener("change", renderWeek);
    }

    async function loadSeasonInto(seasonKey) {
      currentSeason = await loadSeason(seasonKey);
      lastRegularWeek = (currentSeason.leagueSettings?.playoffWeekStart ?? 15) - 1;
      weeklyRecords = computeWeeklyRecords(currentSeason, lastRegularWeek);
      const weeks = Object.keys(currentSeason.matchups)
        .map(Number)
        .filter((w) => w <= lastRegularWeek)
        .sort((a, b) => a - b);

      const weekSelect = document.getElementById("week-select");
      weekSelect.innerHTML =
        weeks.map((w) => `<option value="${w}">Week ${w}</option>`).join("") +
        `<option value="playoffs">Playoffs</option>`;

      if (weeks.length) {
        const latestPlayed = latestWeekWithData(currentSeason);
        weekSelect.value = latestPlayed != null && latestPlayed > lastRegularWeek ? "playoffs" : latestPlayed ?? weeks[0];
        renderWeek();
      } else {
        document.getElementById("matchups-list").innerHTML =
          '<div class="empty-state">No matchups played yet this season.</div>';
      }
    }

    // League median (the middle score across every team that week) for the
    // bonus median win/loss each team's record includes, per the League
    // Median rule. Regular season only — playoffs don't use it.
    function weekMedian(season, week) {
      const scores = [];
      for (const m of season.matchups[week] || []) {
        scores.push(m.teamA.points);
        if (m.teamB) scores.push(m.teamB.points);
      }
      if (!scores.length) return null;
      scores.sort((a, b) => a - b);
      const mid = Math.floor(scores.length / 2);
      return scores.length % 2 === 0 ? (scores[mid - 1] + scores[mid]) / 2 : scores[mid];
    }

    // Per team, per played regular-season week: did they win their
    // matchup, did they beat the median, and their cumulative record
    // (matchup + median results combined) through that week.
    function computeWeeklyRecords(season, throughWeek) {
      const running = new Map(season.teams.map((t) => [t.rosterId, { wins: 0, losses: 0, ties: 0 }]));
      const perWeek = new Map();

      for (let week = 1; week <= throughWeek; week++) {
        if (!weekHasBeenPlayed(season, week)) continue;
        const matchups = season.matchups[week] || [];
        const median = weekMedian(season, week);
        const teamsData = {};

        for (const m of matchups) {
          const sides = [m.teamA, m.teamB].filter(Boolean);
          for (const side of sides) {
            const opponent = sides.length === 2 ? sides.find((s) => s !== side) : null;
            let matchupResult = null;
            if (opponent) {
              if (side.points > opponent.points) matchupResult = "W";
              else if (side.points < opponent.points) matchupResult = "L";
              else matchupResult = "T";
            }
            let medianResult = null;
            if (median != null) {
              if (side.points > median) medianResult = "W";
              else if (side.points < median) medianResult = "L";
              else medianResult = "T";
            }

            const r = running.get(side.rosterId);
            if (r) {
              if (matchupResult === "W") r.wins += 1;
              else if (matchupResult === "L") r.losses += 1;
              else if (matchupResult === "T") r.ties += 1;
              if (medianResult === "W") r.wins += 1;
              else if (medianResult === "L") r.losses += 1;
              else if (medianResult === "T") r.ties += 1;
            }

            teamsData[side.rosterId] = {
              matchupResult,
              medianResult,
              cumRecord: r ? { ...r } : null,
            };
          }
        }
        perWeek.set(week, { median, teams: teamsData });
      }
      return perWeek;
    }

    function renderWeek() {
      const week = document.getElementById("week-select").value;
      const container = document.getElementById("matchups-list");
      if (week === "playoffs") {
        renderPlayoffs(container);
        return;
      }
      container.className = "matchup-grid";
      const weekNum = Number(week);
      const matchups = currentSeason.matchups[week] || [];
      const wr = weeklyRecords.get(weekNum);
      const medianHTML =
        wr && wr.median != null
          ? `<div class="week-median-banner">League Median: <strong>${fmtPts(wr.median)}</strong></div>`
          : "";
      container.innerHTML = medianHTML + matchups.map((m) => renderMatchup(currentSeason, m, weekNum, wr)).join("");
    }

    function scoreBlockHTML(side, played, isWinner) {
      if (!side) return '<div class="points">—</div>';
      if (played) {
        const projHTML =
          side.projPoints != null ? `<div class="proj-points">Proj ${fmtPts(side.projPoints)}</div>` : "";
        return `<div class="points ${isWinner ? "winner" : ""}">${fmtPts(side.points)}</div>${projHTML}`;
      }
      return `
        <div class="points proj-primary">${side.projPoints != null ? fmtPts(side.projPoints) : "—"}</div>
        <div class="proj-points">Projected</div>
      `;
    }

    function weekBadgesHTML(data) {
      if (!data) return "";
      const crown =
        data.matchupResult === "W" ? `<span class="week-icon crown" title="Won the matchup">${CROWN_SVG}</span>` : "";
      const trophy =
        data.medianResult === "W" ? `<span class="week-icon trophy" title="Beat the league median">${TROPHY_SVG}</span>` : "";
      const weekW = (data.matchupResult === "W" ? 1 : 0) + (data.medianResult === "W" ? 1 : 0);
      const weekL = (data.matchupResult === "L" ? 1 : 0) + (data.medianResult === "L" ? 1 : 0);
      const cum = data.cumRecord
        ? `${data.cumRecord.wins}-${data.cumRecord.losses}${data.cumRecord.ties ? "-" + data.cumRecord.ties : ""}`
        : "";
      return `
        <div class="week-icons">${crown}${trophy}</div>
        <div class="week-record">Wk ${weekW}-${weekL} &middot; Season ${cum}</div>
      `;
    }

    function renderMatchup(season, m, week, wr) {
      const teamA = teamById(season, m.teamA.rosterId);
      const teamB = m.teamB ? teamById(season, m.teamB.rosterId) : null;
      const played = weekHasBeenPlayed(season, week);
      const aWins = played && teamB && m.teamA.points > m.teamB.points;
      const bWins = played && teamB && m.teamB.points > m.teamA.points;

      // Rivalry Week started in 2025 — 2024 had no designated rivalries yet.
      const rivalry =
        teamB && parseInt(season.season, 10) >= 2025 ? findRivalry(rivalries, teamA?.ownerId, teamB?.ownerId) : null;
      const isRivalryWeek = week === 1 || week === lastRegularWeek;
      const showRivalry = !!(rivalry && isRivalryWeek);

      const aData = played && wr ? wr.teams[m.teamA.rosterId] : null;
      const bData = played && wr && teamB ? wr.teams[m.teamB.rosterId] : null;

      const clickable = played && teamB;
      const rivalryStyle = showRivalry && rivalry.color ? ` style="--rivalry-color: ${rivalry.color};"` : "";
      return `
        <div class="matchup${showRivalry ? " rivalry-matchup" : ""}${clickable ? " clickable" : ""}"${
        clickable ? ` data-week="${week}" data-t1="${teamA.rosterId}" data-t2="${teamB.rosterId}"` : ""
      }${rivalryStyle}>
          ${showRivalry ? `<div class="rivalry-banner">${rivalry.name}</div>` : ""}
          <div class="matchup-side-block">
            ${teamCellHTML(teamA)}
            ${scoreBlockHTML(m.teamA, played, aWins)}
            ${weekBadgesHTML(aData)}
          </div>
          <div class="vs">vs</div>
          <div class="matchup-side-block">
            ${teamB ? teamCellHTML(teamB) : '<span class="muted">Bye</span>'}
            ${scoreBlockHTML(m.teamB, played, bWins)}
            ${weekBadgesHTML(bData)}
          </div>
        </div>
      `;
    }

    // ---------- playoff bracket ----------

    // A bracket round's matches happen in a real season week — round 1 of
    // the playoffs is the season's first playoff week, round 2 the next,
    // and so on — so scores (and rosters) can be pulled straight from that
    // week's actual matchup data.
    function matchupEntryForRosterInWeek(season, week, rosterId) {
      if (rosterId == null) return null;
      const matchups = season.matchups?.[week] || season.matchups?.[String(week)] || [];
      return matchups.find((m) => m.teamA.rosterId === rosterId || m.teamB?.rosterId === rosterId) || null;
    }

    function bracketSideHTML(season, rosterId, fromLabel, isWinner, week) {
      if (rosterId != null) {
        const team = teamById(season, rosterId);
        const entry = week != null ? matchupEntryForRosterInWeek(season, week, rosterId) : null;
        const score = entry ? (entry.teamA.rosterId === rosterId ? entry.teamA.points : entry.teamB.points) : null;
        return `<div class="bracket-side${isWinner ? " winner" : ""}">
          ${team ? teamCellHTML(team) : '<span class="muted">Unknown</span>'}
          ${score != null ? `<span class="bracket-score">${fmtPts(score)}</span>` : ""}
        </div>`;
      }
      return `<div class="bracket-side"><span class="bracket-placeholder">${fromLabel || "TBD"}</span></div>`;
    }

    // A t1_from/t2_from of {w: N} or {l: N} means "winner/loser of match N" —
    // resolve that to a human label when the match itself hasn't been
    // decided yet.
    function fromLabel(from) {
      if (!from) return null;
      if (from.w != null) return `Winner of Game ${from.w}`;
      if (from.l != null) return `Loser of Game ${from.l}`;
      return "TBD";
    }

    function bracketMatchHTML(season, m, week) {
      const t1Winner = m.w != null && m.w === m.t1;
      const t2Winner = m.w != null && m.w === m.t2;
      const clickable = week != null && m.t1 != null && m.t2 != null;
      return `
        <div class="bracket-match"${clickable ? ` data-week="${week}" data-t1="${m.t1}" data-t2="${m.t2}"` : ""}>
          ${bracketSideHTML(season, m.t1, fromLabel(m.t1_from), t1Winner, week)}
          <span class="bracket-vs">vs</span>
          ${bracketSideHTML(season, m.t2, fromLabel(m.t2_from), t2Winner, week)}
        </div>
      `;
    }

    // Only the championship and 3rd-place game are shown — 5th/7th place
    // games aren't, since the rookie draft order for those slots comes
    // from Max PF, not from these results, and showing them next to each
    // other would look contradictory.
    const PLACE_LABELS = { 1: "Championship", 3: "3rd Place Game" };
    const HIDDEN_PLACES = new Set([5, 7]);

    function bracketRoundsHTML(season, matches, playoffWeekStart) {
      let visible = matches.filter((m) => !HIDDEN_PLACES.has(m.p));

      // With the 5th/7th place games gone, the semifinal-round matches that
      // only fed into those (never into the championship or 3rd-place game)
      // don't lead anywhere shown either — drop them too, keeping just the
      // 2 true semifinal matches.
      const roundNums = [...new Set(visible.map((m) => m.r))].sort((a, b) => a - b);
      if (roundNums.length >= 2) {
        const finalRound = roundNums[roundNums.length - 1];
        const referenced = new Set();
        for (const m of visible) {
          if (m.r !== finalRound) continue;
          if (m.t1_from) referenced.add(m.t1_from.w ?? m.t1_from.l);
          if (m.t2_from) referenced.add(m.t2_from.w ?? m.t2_from.l);
        }
        const semiRound = roundNums[roundNums.length - 2];
        visible = visible.filter((m) => m.r !== semiRound || referenced.has(m.m));
      }

      const rounds = [...new Set(visible.map((m) => m.r))].sort((a, b) => a - b);
      return rounds
        .map((r) => {
          const roundMatches = visible.filter((m) => m.r === r);
          const placementMatches = roundMatches.filter((m) => m.p != null);
          const title = placementMatches.length ? "Placement Games" : `Round ${r}`;
          const week = playoffWeekStart != null ? playoffWeekStart + r - 1 : null;
          const rowsHTML = roundMatches
            .map((m) => {
              const label = m.p != null ? PLACE_LABELS[m.p] || `Place ${m.p}/${m.p + 1} Game` : null;
              return `${label ? `<div class="bracket-round-title" style="font-size:0.55rem;margin:12px 0 4px;">${label}</div>` : ""}${bracketMatchHTML(season, m, week)}`;
            })
            .join("");
          return `<div class="bracket-round-title">${title}</div><div class="draft-list">${rowsHTML}</div>`;
        })
        .join("");
    }

    function renderPlayoffs(container) {
      container.className = "";
      const winners = currentSeason.playoffBracket?.winners || [];
      const losers = currentSeason.playoffBracket?.losers || [];
      const playoffWeekStart = currentSeason.leagueSettings?.playoffWeekStart ?? null;
      // Sleeper pre-seeds round 1 of the bracket before the playoffs
      // actually start (based on current, still-changing standings) — with
      // no winner decided on any match yet, that's not a real bracket, just
      // a placeholder, so treat it the same as no bracket at all.
      const started = winners.some((m) => m.w != null);

      if (!winners.length || !started) {
        container.innerHTML = '<div class="empty-state">The playoff bracket isn\'t set yet this season.</div>';
        return;
      }

      const winnersHTML = bracketRoundsHTML(currentSeason, winners, playoffWeekStart);
      // The loser's-bracket bonus pick (3.13) is new starting in 2026 —
      // don't show that bracket for earlier seasons even though the raw
      // Sleeper data exists for them too.
      const showLosersBracket = losers.length && parseInt(currentSeason.season, 10) >= 2026;
      const losersHTML = showLosersBracket
        ? `<div class="info-section-title" style="margin-top:32px;">Loser's Bracket (Bonus Pick 3.13)</div>${bracketRoundsHTML(
            currentSeason,
            losers,
            playoffWeekStart
          )}`
        : "";

      container.innerHTML = `
        <div class="info-section-title">Playoff Bracket</div>
        ${winnersHTML}
        ${losersHTML}
      `;
    }

    // ---------- matchup detail modal ----------

    let matchupPlayersCache = null;

    function matchupPlayerRowHTML(players, playerId, season, week) {
      const p = players[playerId];
      const name = p ? p.name : "Unknown Player";
      const meta = p ? [p.position, p.nflTeam].filter(Boolean).join(" &middot; ") : "";
      const game = p?.seasons?.[season.season]?.games?.find((g) => g.week === week);
      const pts = game ? game.points : null;
      return `
        <div class="roster-player">
          <span>${playerLinkHTML(playerId, name)}${meta ? `<span class="player-meta">${meta}</span>` : ""}</span>
          <span class="info-stat-value">${pts != null ? fmtPts(pts) : "—"}</span>
        </div>
      `;
    }

    function matchupRosterGroupHTML(title, playerIds, players, season, week) {
      if (!playerIds.length) return "";
      return `
        <div class="roster-group">
          <div class="roster-group-title">${title} (${playerIds.length})</div>
          ${playerIds.map((pid) => matchupPlayerRowHTML(players, pid, season, week)).join("")}
        </div>
      `;
    }

    function matchupSideHTML(season, week, team, side, players) {
      if (!team || !side) return `<div class="empty-state">No roster data for this team.</div>`;
      const starters = new Set(side.starters || []);
      const bench = (side.players || []).filter((pid) => !starters.has(pid));
      return `
        <div class="info-section-title">${team.teamName} &mdash; ${fmtPts(side.points)} pts</div>
        ${matchupRosterGroupHTML("Starters", side.starters || [], players, season, week)}
        ${matchupRosterGroupHTML("Bench", bench, players, season, week)}
      `;
    }

    async function openMatchupModal(season, week, rosterIdA, rosterIdB) {
      let root = document.getElementById("player-modal-root");
      if (!root) {
        root = document.createElement("div");
        root.id = "player-modal-root";
        document.body.appendChild(root);
      }
      root.innerHTML = `
        <div class="modal-overlay" id="player-modal-overlay">
          <div class="modal-box wide"><div class="empty-state">Loading...</div></div>
        </div>
      `;
      root.querySelector("#player-modal-overlay").addEventListener("click", (e) => {
        if (e.target.id === "player-modal-overlay") closePlayerModal();
      });

      if (!matchupPlayersCache) matchupPlayersCache = await loadPlayers();
      const players = matchupPlayersCache;

      const entry = matchupEntryForRosterInWeek(season, week, rosterIdA);
      const sideA = entry ? (entry.teamA.rosterId === rosterIdA ? entry.teamA : entry.teamB) : null;
      const sideB = entry ? (entry.teamA.rosterId === rosterIdB ? entry.teamA : entry.teamB) : null;
      const teamA = teamById(season, rosterIdA);
      const teamB = teamById(season, rosterIdB);

      const box = document.getElementById("player-modal-root").querySelector(".modal-box");
      box.innerHTML = `
        <button class="modal-close" id="player-modal-close">&times;</button>
        <div class="modal-header">
          <h2>Week ${week}</h2>
          <div class="modal-subtitle">${teamA ? teamA.teamName : "?"} vs ${teamB ? teamB.teamName : "?"}</div>
        </div>
        <div class="modal-tab-content matchup-modal-columns">
          <div>${matchupSideHTML(season, week, teamA, sideA, players)}</div>
          <div>${matchupSideHTML(season, week, teamB, sideB, players)}</div>
        </div>
      `;
      box.querySelector("#player-modal-close").addEventListener("click", closePlayerModal);
    }

    document.getElementById("matchups-list").addEventListener("click", (e) => {
      const matchupEl = e.target.closest(".matchup[data-week]");
      const bracketEl = e.target.closest(".bracket-match[data-week]");
      const el = matchupEl || bracketEl;
      if (!el) return;
      openMatchupModal(currentSeason, Number(el.dataset.week), Number(el.dataset.t1), Number(el.dataset.t2));
    });

    init().catch((err) => {
      console.error(err);
      document.getElementById("matchups-list").innerHTML =
        '<div class="empty-state">Could not load league data.</div>';
    });
  </script>
</body>
</html>
