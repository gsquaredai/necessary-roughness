name: Update League Data

on:
  schedule:
    # Every 6 hours, year-round. Sleeper data is static in the offseason
    # so these runs are a no-op commit-wise (the job skips committing if
    # nothing changed).
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest Sleeper data
        run: node scripts/fetch-sleeper.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update league data"
            git push
          fi
